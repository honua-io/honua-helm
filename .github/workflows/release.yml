name: Helm Release

on:
  push:
    tags:
      - 'chart-v*'
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Chart semver (no v prefix), e.g. 0.2.0'
        required: true
        type: string
      app_version:
        description: 'honua-server release semver (no v prefix, no -aot suffix), e.g. 1.2.3'
        required: true
        type: string
permissions:
  contents: read

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      chart-version: ${{ steps.versions.outputs.chart_version }}
      app-version: ${{ steps.versions.outputs.app_version }}
      artifact-name: ${{ steps.package.outputs.artifact_name }}
      oci-digest: ${{ steps.push.outputs.digest }}
    env:
      OCI_REGISTRY: oci://ghcr.io/honua-io/charts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Add Bitnami chart repository
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Resolve chart_version and app_version
        id: versions
        shell: bash
        env:
          DISPATCH_CHART_VERSION: ${{ inputs.chart_version }}
          DISPATCH_APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          # SemVer (no `v` prefix). Optional pre-release allowed; build metadata ('+...') is
          # rejected because Docker image tags and OCI references do not allow '+'. The image tag
          # is stamped as v${app_version}-aot, and the chart is published to an OCI registry.
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            chart_version="${DISPATCH_CHART_VERSION}"
            app_version="${DISPATCH_APP_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
            if [[ ! "${tag}" =~ ^chart-v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$ ]]; then
              echo "::error::Tag '${tag}' does not match chart-vX.Y.Z[-suffix]" >&2
              exit 1
            fi
            chart_version="${tag#chart-v}"
            app_version="$(yq -r '.appVersion' honua/Chart.yaml)"
          fi
          if [[ -z "${chart_version}" ]]; then
            echo "::error::chart_version is empty" >&2
            exit 1
          fi
          if [[ ! "${chart_version}" =~ ${semver_re} ]]; then
            echo "::error::chart_version '${chart_version}' is not SemVer (X.Y.Z[-prerelease], no 'v' prefix, no '+' build metadata). Example: 0.2.0 or 0.2.0-rc.1" >&2
            exit 1
          fi
          if [[ -z "${app_version}" || "${app_version}" == "null" || "${app_version}" == "0.0.0" ]]; then
            echo "::error::app_version must be a real honua-server release (got: '${app_version}'). For tag-triggered runs, commit Chart.yaml appVersion to the target server tag before tagging, or trigger via workflow_dispatch." >&2
            exit 1
          fi
          if [[ "${app_version}" == v* ]]; then
            echo "::error::app_version '${app_version}' must not start with 'v' â€” supply the bare server SemVer (e.g. 1.2.3, not v1.2.3). The image tag is stamped as v\${app_version}-aot." >&2
            exit 1
          fi
          if [[ "${app_version}" == *-aot ]]; then
            echo "::error::app_version '${app_version}' must not end with '-aot' â€” supply the bare server SemVer (e.g. 1.2.3, not 1.2.3-aot). The image tag is stamped as v\${app_version}-aot." >&2
            exit 1
          fi
          if [[ ! "${app_version}" =~ ${semver_re} ]]; then
            echo "::error::app_version '${app_version}' is not SemVer (X.Y.Z[-prerelease], no 'v' prefix, no '-aot' suffix, no '+' build metadata). Example: 1.2.3 or 1.2.3-rc.1" >&2
            exit 1
          fi
          image_tag="v${app_version}-aot"
          echo "chart_version=${chart_version}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "Resolved chart_version=${chart_version} app_version=${app_version} image_tag=${image_tag}"

      - name: Verify signed release tag
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_object="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")"
          if [[ "$(git cat-file -t "${tag_object}")" != "tag" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must be annotated and signed."
            exit 1
          fi
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')" != "true" ]]; then
            echo "::error::GitHub did not verify the signature on ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Login to ghcr.io
        shell: bash
        env:
          GH_USERNAME: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io --username "${GH_USERNAME}" --password-stdin
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GH_USERNAME}" --password-stdin

      - name: Verify honua-server image exists for stamped IMAGE_TAG
        id: verify-image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
        run: |
          set -euo pipefail
          image_ref="ghcr.io/honua-io/honua-server:${IMAGE_TAG}"
          if ! image_digest="$(docker buildx imagetools inspect "${image_ref}" --format '{{printf "%s" .Manifest.Digest}}' 2>/tmp/buildx-err.txt)"; then
            echo "::error::honua-server image not found at ${image_ref}. Chart releases must point at a published honua-server release; bump Chart.yaml appVersion (or workflow_dispatch app_version) only after the server tag's AOT image has been promoted to ghcr.io." >&2
            cat /tmp/buildx-err.txt >&2 || true
            exit 1
          fi
          if [[ -z "${image_digest}" ]]; then
            echo "::error::Empty digest from manifest for ${image_ref}." >&2
            exit 1
          fi
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest from manifest for ${image_ref}; expected a single sha256 digest." >&2
            printf '%s\n' "${image_digest}" >&2
            exit 1
          fi
          printf 'image_digest=%s\n' "${image_digest}" >> "${GITHUB_OUTPUT}"
          echo "Verified ${image_ref} -> ${image_digest}"

      - name: Build dependencies from Chart.lock
        run: helm dependency build honua

      - name: Stamp Chart.yaml and values.yaml
        shell: bash
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          APP_VERSION: ${{ steps.versions.outputs.app_version }}
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
        run: |
          set -euo pipefail
          yq -i '.version = strenv(CHART_VERSION)' honua/Chart.yaml
          yq -i '.appVersion = strenv(APP_VERSION)' honua/Chart.yaml
          yq -i '.image.tag = strenv(IMAGE_TAG)' honua/values.yaml
          echo "--- Chart.yaml after stamp ---"
          yq '.' honua/Chart.yaml
          echo "--- values.yaml image block after stamp ---"
          yq '.image' honua/values.yaml

      - name: Lint chart (publish-time guard)
        run: helm lint honua -f honua/ci-values/base.yaml

      - name: Render templates (publish-time guard)
        run: helm template honua ./honua -f honua/ci-values/base.yaml > /tmp/honua-rendered-base.yaml

      - name: Package chart
        id: package
        shell: bash
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package honua --destination dist/
          artifact="dist/honua-${CHART_VERSION}.tgz"
          if [[ ! -f "${artifact}" ]]; then
            echo "::error::Expected packaged artifact ${artifact} was not produced." >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          artifact_name="$(basename "${artifact}")"
          (
            cd dist
            sha256sum "${artifact_name}" > "${artifact_name}.sha256"
          )
          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "Packaged ${artifact}"

      - name: Refuse an existing OCI chart version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_USERNAME: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            --user "${GH_USERNAME}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository%3Ahonua-io%2Fcharts%2Fhonua%3Apull" \
            | jq -r '.token')"
          if [[ -z "${token}" || "${token}" == "null" ]]; then
            echo "::error::Could not obtain a scoped GHCR read token."
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request HEAD \
            --header "Authorization: Bearer ${token}" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/honua-io/charts/honua/manifests/${CHART_VERSION}")"
          if [[ "${status}" == "200" ]]; then
            echo "::error::OCI chart version ${CHART_VERSION} already exists; chart versions are immutable."
            exit 1
          fi
          if [[ "${status}" != "404" ]]; then
            echo "::error::Could not prove OCI chart version ${CHART_VERSION} is absent (HTTP ${status})."
            exit 1
          fi

      - name: Push chart to OCI registry
        id: push
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          APP_VERSION: ${{ steps.versions.outputs.app_version }}
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
          SERVER_IMAGE_DIGEST: ${{ steps.verify-image.outputs.image_digest }}
        run: |
          set -euo pipefail
          push_log="$(helm push "${ARTIFACT}" "${OCI_REGISTRY}" 2>&1 | tee /dev/stderr)"
          digest="$(printf '%s\n' "${push_log}" | awk '/Digest:/ {print $2; exit}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to parse OCI sha256 digest from helm push output." >&2
            exit 1
          fi
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Helm chart published"
            echo ""
            echo "- Registry: \`${OCI_REGISTRY}/honua\`"
            echo "- Chart version: \`${CHART_VERSION}\`"
            echo "- App version: \`${APP_VERSION}\`"
            echo "- Image tag stamped: \`${IMAGE_TAG}\`"
            echo "- Server image digest (verified pre-publish): \`${SERVER_IMAGE_DIGEST}\`"
            echo "- OCI digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Summarize dry-run (no publish)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          APP_VERSION: ${{ steps.versions.outputs.app_version }}
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
          SERVER_IMAGE_DIGEST: ${{ steps.verify-image.outputs.image_digest }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: |
          set -euo pipefail
          {
            echo "## Helm chart dry run (no publish)"
            echo ""
            echo "- Chart version: \`${CHART_VERSION}\`"
            echo "- App version: \`${APP_VERSION}\`"
            echo "- Image tag stamped: \`${IMAGE_TAG}\`"
            echo "- Server image digest (verified pre-publish): \`${SERVER_IMAGE_DIGEST}\`"
            echo "- Packaged artifact: \`${ARTIFACT}\` (not pushed)"
            echo ""
            echo "Push a signed annotated tag \`chart-v${CHART_VERSION}\` to publish to \`${OCI_REGISTRY}\`, verify anonymous pull, and create a GitHub Release."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Dry run complete; chart packaged but not pushed to ${OCI_REGISTRY}."

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          APP_VERSION: ${{ steps.versions.outputs.app_version }}
          IMAGE_TAG: ${{ steps.versions.outputs.image_tag }}
          SERVER_IMAGE_DIGEST: ${{ steps.verify-image.outputs.image_digest }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          tag="chart-v${CHART_VERSION}"
          prev_tag="$(git tag --list 'chart-v*' --sort=-version:refname | grep -v "^${tag}\$" | head -n1 || true)"
          if [[ -n "${prev_tag}" ]]; then
            range="${prev_tag}..HEAD"
            range_label="since ${prev_tag}"
          else
            range="HEAD"
            range_label="initial release"
          fi
          {
            echo "## Honua Helm chart ${tag}"
            echo ""
            echo "- App version: \`${APP_VERSION}\`"
            echo "- Image tag stamped: \`${IMAGE_TAG}\`"
            echo "- Server image: \`ghcr.io/honua-io/honua-server:${IMAGE_TAG}\`"
            echo "- Server image digest (verified pre-publish): \`${SERVER_IMAGE_DIGEST}\`"
            echo "- OCI: \`oci://ghcr.io/honua-io/charts/honua\` version \`${CHART_VERSION}\`"
            if [[ -n "${DIGEST}" ]]; then
              echo "- Digest: \`${DIGEST}\`"
            fi
            echo ""
            echo "### Install"
            echo ""
            echo "\`\`\`bash"
            echo "helm upgrade --install honua oci://ghcr.io/honua-io/charts/honua --version ${CHART_VERSION} \\"
            echo "  --set config.env.ASPNETCORE_ENVIRONMENT=\"Development\" \\"
            echo "  --set secret.env.ConnectionStrings__DefaultConnection=\"Host=postgres;Database=honua;Username=honua;Password=honua\" \\"
            echo "  --set secret.env.HONUA_ADMIN_PASSWORD=\"ExampleAdminPassword1!\" \\"
            echo "  --set secret.env.Security__ConnectionEncryption__MasterKey=\"example-connection-encryption-master-key\""
            echo "\`\`\`"
            echo ""
            echo "The chart enforces its values contract: \`HONUA_ADMIN_PASSWORD\` must be 16+ chars (upper/lower/digit/special) and \`Security__ConnectionEncryption__MasterKey\` 32+ chars. The snippet above uses \`ASPNETCORE_ENVIRONMENT=Development\` for a minimal evaluation install; production deployments should use \`values-prod.yaml\` with a pinned image and supply \`ConnectionStrings__redis\`."
            echo ""
            echo "### Changes (${range_label})"
            echo ""
            git log --pretty=format:'- %s (%h)' "${range}" -- honua docs .github/workflows 2>/dev/null || echo "- (no commits in range)"
            echo ""
          } > release-notes.md
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Attest packaged chart provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.artifact }}

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-release-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 90

  verify-public:
    name: Verify anonymous OCI pull
    needs: package-and-publish
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OCI_CHART: oci://ghcr.io/honua-io/charts/honua
    steps:
      - name: Use an anonymous Helm registry configuration
        run: echo "HELM_REGISTRY_CONFIG=${RUNNER_TEMP}/anonymous-registry-config.json" >> "${GITHUB_ENV}"

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Download expected checksum
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-release-${{ github.run_id }}
          path: expected

      - name: Pull and verify without credentials
        env:
          CHART_VERSION: ${{ needs.package-and-publish.outputs.chart-version }}
          APP_VERSION: ${{ needs.package-and-publish.outputs.app-version }}
          ARTIFACT_NAME: ${{ needs.package-and-publish.outputs.artifact-name }}
        run: |
          set -euo pipefail
          mkdir -p public
          for attempt in $(seq 1 30); do
            rm -f "public/${ARTIFACT_NAME}"
            if helm pull "${OCI_CHART}" --version "${CHART_VERSION}" --destination public; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              echo "::error::The chart could not be pulled anonymously. If this is the first GHCR chart cut, set the charts/honua package visibility to Public and rerun failed jobs only."
              exit 1
            fi
            sleep 10
          done
          cp "expected/${ARTIFACT_NAME}.sha256" "public/${ARTIFACT_NAME}.sha256"
          (
            cd public
            sha256sum --check "${ARTIFACT_NAME}.sha256"
          )
          actual_chart_version="$(helm show chart "public/${ARTIFACT_NAME}" | awk '$1 == "version:" {print $2}')"
          actual_app_version="$(helm show chart "public/${ARTIFACT_NAME}" | awk '$1 == "appVersion:" {gsub(/\"/, "", $2); print $2}')"
          test "${actual_chart_version}" = "${CHART_VERSION}"
          test "${actual_app_version}" = "${APP_VERSION}"

  release:
    name: Create chart release
    needs: [package-and-publish, verify-public]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-release-${{ github.run_id }}
          path: release-bundle

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ needs.package-and-publish.outputs.chart-version }}
          ARTIFACT_NAME: ${{ needs.package-and-publish.outputs.artifact-name }}
        run: |
          set -euo pipefail
          tag="chart-v${CHART_VERSION}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} already exists; chart versions are immutable."
            exit 1
          fi
          gh release create "${tag}" \
            "release-bundle/${ARTIFACT_NAME}" \
            "release-bundle/${ARTIFACT_NAME}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${tag}" \
            --notes-file release-bundle/release-notes.md
