name: Helm CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update dependencies
        run: helm dependency update honua

      - name: Lint chart
        run: helm lint honua

      - name: Render templates
        run: helm template honua ./honua > /tmp/honua-rendered.yaml
