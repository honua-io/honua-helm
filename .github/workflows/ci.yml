name: Helm CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

jobs:
  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2

      - name: Add Bitnami chart repository
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Build dependencies from Chart.lock
        run: helm dependency build honua

      - name: Lint chart
        run: helm lint honua -f honua/ci-values/base.yaml

      - name: Lint environment overlays
        run: |
          helm lint honua -f honua/values-dev.yaml
          helm lint honua -f honua/values-stage.yaml
          # values-prod.yaml intentionally clears image.tag so a from-checkout
          # install must supply an immutable pin; lint with a representative pin.
          helm lint honua -f honua/values-prod.yaml --set image.tag=v0.0.0-aot

      - name: Render templates (base)
        run: helm template honua ./honua -f honua/ci-values/base.yaml > /tmp/honua-rendered-base.yaml

      - name: Render templates (environment overlays)
        run: |
          helm template honua-dev ./honua -f honua/values-dev.yaml > /tmp/honua-rendered-dev.yaml
          helm template honua-stage ./honua -f honua/values-stage.yaml > /tmp/honua-rendered-stage.yaml
          helm template honua-prod ./honua -f honua/values-prod.yaml --set image.tag=v0.0.0-aot > /tmp/honua-rendered-prod.yaml

      - name: Render staged upgrade path
        run: |
          helm template honua-stage ./honua -f honua/values-stage.yaml --is-upgrade > /tmp/honua-rendered-stage-upgrade.yaml

      - name: Lint AKS smoke overlays
        run: |
          helm lint honua -f honua/ci-values/aks-smoke-install.yaml
          helm lint honua -f honua/ci-values/aks-smoke-upgrade.yaml

      - name: Render AKS smoke overlays (install + upgrade path)
        run: |
          helm template honua ./honua -f honua/ci-values/aks-smoke-install.yaml > /tmp/honua-rendered-aks-install.yaml
          helm template honua ./honua --is-upgrade -f honua/ci-values/aks-smoke-upgrade.yaml > /tmp/honua-rendered-aks-upgrade.yaml

      - name: Render templates (ingress hosts empty)
        run: helm template honua ./honua -f honua/ci-values/ingress-empty.yaml > /tmp/honua-rendered-ingress-empty.yaml

      - name: Render templates (external secret)
        run: helm template honua ./honua -f honua/ci-values/external-secret.yaml > /tmp/honua-rendered-external-secret.yaml

      - name: Render templates (autoscaling cpu)
        run: helm template honua ./honua -f honua/ci-values/autoscaling-cpu.yaml > /tmp/honua-rendered-autoscaling-cpu.yaml

      - name: Render templates (redis auth)
        run: helm template honua ./honua -f honua/ci-values/redis-auth.yaml > /tmp/honua-rendered-redis-auth.yaml

      - name: Render templates (observability)
        run: helm template honua ./honua -f honua/ci-values/observability.yaml > /tmp/honua-rendered-observability.yaml

      - name: Assert observability resources render
        run: |
          set -euo pipefail
          grep -q 'kind: ServiceMonitor' /tmp/honua-rendered-observability.yaml
          grep -q 'kind: PrometheusRule' /tmp/honua-rendered-observability.yaml
          grep -q 'OTEL_EXPORTER_OTLP_ENDPOINT' /tmp/honua-rendered-observability.yaml
          grep -q 'prometheus.io/scrape: "true"' /tmp/honua-rendered-observability.yaml
          # Metrics resources must NOT render in the baseline (opt-in only).
          if grep -q 'kind: ServiceMonitor' /tmp/honua-rendered-base.yaml; then
            echo "ServiceMonitor must not render without metrics.serviceMonitor.enabled."
            exit 1
          fi

      - name: Render templates (digest image)
        run: helm template honua ./honua -f honua/ci-values/digest.yaml > /tmp/honua-rendered-digest.yaml

      - name: Render templates (rolling update)
        run: helm template honua ./honua -f honua/ci-values/rolling-update.yaml > /tmp/honua-rendered-rolling-update.yaml

      - name: Render templates (chart-managed postgresql install)
        run: helm template honua ./honua -f honua/ci-values/postgresql.yaml > /tmp/honua-rendered-postgresql-install.yaml

      - name: Render templates (chart-managed postgresql upgrade)
        run: helm template honua ./honua --is-upgrade -f honua/ci-values/postgresql.yaml > /tmp/honua-rendered-postgresql-upgrade.yaml

      - name: Render templates (dependency name overrides)
        run: helm template honua ./honua -f honua/ci-values/dependency-name-overrides.yaml > /tmp/honua-rendered-dependency-name-overrides.yaml

      - name: Render templates (dependency fullname overrides)
        run: helm template honua ./honua -f honua/ci-values/dependency-fullname-overrides.yaml > /tmp/honua-rendered-dependency-fullname-overrides.yaml

      - name: Assert rendered override behavior
        run: |
          set -euo pipefail

          pg_name_override="$(printf '%s' 'Host=honua-pgsvc;Port=55432;Database=honua;Username=honua;Password=ci-password' | base64 | tr -d '\n')"
          redis_name_override="$(printf '%s' 'honua-cache-master:16379,password=ci-redis-password' | base64 | tr -d '\n')"
          pg_fullname_override="$(printf '%s' 'Host=custom-postgresql;Port=55433;Database=honua;Username=honua;Password=ci-password' | base64 | tr -d '\n')"
          redis_fullname_override="$(printf '%s' 'custom-redis-master:26379,password=ci-redis-password' | base64 | tr -d '\n')"

          grep -q "ConnectionStrings__DefaultConnection: ${pg_name_override}" /tmp/honua-rendered-dependency-name-overrides.yaml
          grep -q "ConnectionStrings__redis: ${redis_name_override}" /tmp/honua-rendered-dependency-name-overrides.yaml
          grep -q "ConnectionStrings__DefaultConnection: ${pg_fullname_override}" /tmp/honua-rendered-dependency-fullname-overrides.yaml
          grep -q "ConnectionStrings__redis: ${redis_fullname_override}" /tmp/honua-rendered-dependency-fullname-overrides.yaml

          if ! grep -A80 'name: "honua-honua-test-connection"' /tmp/honua-rendered-base.yaml | grep -q 'automountServiceAccountToken: false'; then
            echo "Helm test hook pod must set automountServiceAccountToken: false."
            exit 1
          fi

      - name: Assert operator contract rendering
        run: |
          set -euo pipefail

          grep -q 'name: honua-honua-release-info' /tmp/honua-rendered-base.yaml
          grep -q 'name: honua-honua-preflight' /tmp/honua-rendered-base.yaml
          grep -q 'type: Recreate' /tmp/honua-rendered-base.yaml
          grep -q 'failureThreshold: 60' /tmp/honua-rendered-base.yaml
          grep -q 'honua.io/image-reference:' /tmp/honua-rendered-base.yaml
          grep -q 'honua.io/chart-version:' /tmp/honua-rendered-base.yaml
          grep -q 'honua.io/app-version:' /tmp/honua-rendered-base.yaml
          grep -q 'HONUA_IMAGE_REFERENCE:' /tmp/honua-rendered-base.yaml
          grep -q 'Security__ConnectionEncryption__MasterKey:' /tmp/honua-rendered-base.yaml
          grep -q 'readiness.contract=/healthz/ready returns success after Honua startup and migrations are complete' /tmp/honua-rendered-base.yaml

          # Read-only root needs a writable /tmp scratch volume by default.
          grep -q 'mountPath: /tmp' /tmp/honua-rendered-base.yaml
          # Single-replica baseline must not get the default anti-affinity.
          if grep -q 'podAntiAffinity' /tmp/honua-rendered-base.yaml; then
            echo "Single-replica baseline should not render default pod anti-affinity."
            exit 1
          fi

          grep -q 'image: "ghcr.io/honua-io/honua-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' /tmp/honua-rendered-digest.yaml
          grep -q 'honua.io/image-digest: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' /tmp/honua-rendered-digest.yaml
          grep -q 'honua.io/release-id: "honua-ci-digest"' /tmp/honua-rendered-digest.yaml

          grep -q 'type: RollingUpdate' /tmp/honua-rendered-rolling-update.yaml
          grep -q 'maxSurge: 0' /tmp/honua-rendered-rolling-update.yaml
          grep -q 'maxUnavailable: 1' /tmp/honua-rendered-rolling-update.yaml

          grep -A1 'name: HONUA_PREFLIGHT_DATABASE_CHECK' /tmp/honua-rendered-base.yaml | grep -q 'value: "true"'
          grep -A1 'name: HONUA_PREFLIGHT_DATABASE_CHECK' /tmp/honua-rendered-postgresql-install.yaml | grep -q 'value: "false"'
          grep -A1 'name: HONUA_PREFLIGHT_DATABASE_CHECK' /tmp/honua-rendered-postgresql-upgrade.yaml | grep -q 'value: "true"'

          # The preflight hook retries reachability probes in-script (backoffLimit
          # is 0), so the retry env must be wired into the Job.
          grep -q 'name: HONUA_PREFLIGHT_RETRIES' /tmp/honua-rendered-base.yaml
          grep -q 'name: HONUA_PREFLIGHT_RETRY_DELAY_SECONDS' /tmp/honua-rendered-base.yaml

          # Multi-replica (autoscaling) workloads get the default soft anti-affinity.
          grep -q 'podAntiAffinity' /tmp/honua-rendered-autoscaling-cpu.yaml

          # Memory-based autoscaling is off by default: with only CPU configured
          # (autoscaling-cpu.yaml leaves the memory target unset) the HPA renders
          # a cpu metric and no memory metric.
          grep -q 'name: cpu' /tmp/honua-rendered-autoscaling-cpu.yaml
          if grep -q 'name: memory' /tmp/honua-rendered-autoscaling-cpu.yaml; then
            echo "HPA must not render a memory metric when targetMemoryUtilizationPercentage defaults to 0."
            exit 1
          fi

      - name: Assert AKS smoke overlay operator contract
        run: |
          set -euo pipefail

          # AKS install overlay must render the migration-safe contract surfaces.
          grep -q 'name: honua-honua-preflight' /tmp/honua-rendered-aks-install.yaml
          grep -q 'name: honua-honua-release-info' /tmp/honua-rendered-aks-install.yaml
          grep -q 'type: Recreate' /tmp/honua-rendered-aks-install.yaml
          grep -q 'honua.io/release-id: "honua-aks-smoke-install"' /tmp/honua-rendered-aks-install.yaml
          # External managed data services: no chart-managed PostgreSQL/Redis subcharts.
          if grep -q 'name: honua-postgresql' /tmp/honua-rendered-aks-install.yaml; then
            echo "AKS install overlay must not render the chart-managed PostgreSQL subchart."
            exit 1
          fi
          grep -q 'honua.io/release-id: "honua-aks-smoke-upgrade"' /tmp/honua-rendered-aks-upgrade.yaml

      - name: Validate autoscaling guard fails invalid config
        run: |
          set +e
          helm template honua ./honua -f honua/ci-values/autoscaling-invalid.yaml > /tmp/honua-rendered-autoscaling-invalid.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected autoscaling-invalid render to fail."
            cat /tmp/honua-rendered-autoscaling-invalid.yaml
            exit 1
          fi

      - name: Validate rolling update guard fails invalid zero budget
        run: |
          for budget_type in int string percent; do
            set +e
            case "${budget_type}" in
              int)
                helm template honua ./honua \
                  -f honua/ci-values/base.yaml \
                  --set strategy.type=RollingUpdate \
                  --set strategy.rollingUpdate.maxSurge=0 \
                  --set strategy.rollingUpdate.maxUnavailable=0 \
                  > "/tmp/honua-rendered-rolling-update-zero-budget-${budget_type}.yaml" 2>&1
                ;;
              string)
                helm template honua ./honua \
                  -f honua/ci-values/base.yaml \
                  --set strategy.type=RollingUpdate \
                  --set-string strategy.rollingUpdate.maxSurge=0 \
                  --set-string strategy.rollingUpdate.maxUnavailable=0 \
                  > "/tmp/honua-rendered-rolling-update-zero-budget-${budget_type}.yaml" 2>&1
                ;;
              percent)
                helm template honua ./honua \
                  -f honua/ci-values/base.yaml \
                  --set strategy.type=RollingUpdate \
                  --set-string strategy.rollingUpdate.maxSurge='0%' \
                  --set-string strategy.rollingUpdate.maxUnavailable='0%' \
                  > "/tmp/honua-rendered-rolling-update-zero-budget-${budget_type}.yaml" 2>&1
                ;;
            esac
            status=$?
            set -e
            if [[ "${status}" -eq 0 ]]; then
              echo "Expected RollingUpdate zero rollout budget (${budget_type}) render to fail."
              cat "/tmp/honua-rendered-rolling-update-zero-budget-${budget_type}.yaml"
              exit 1
            fi
          done

      - name: Validate digest guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/ci-values/base.yaml \
            --set image.tag="" \
            --set image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set image.pullPolicy=Always \
            > /tmp/honua-rendered-digest-invalid.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected digest + pullPolicy Always render to fail."
            cat /tmp/honua-rendered-digest-invalid.yaml
            exit 1
          fi

      - name: Validate image identity guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/ci-values/base.yaml \
            --set image.tag="" \
            --set image.digest="" \
            > /tmp/honua-rendered-image-empty.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected empty image.tag and image.digest render to fail."
            cat /tmp/honua-rendered-image-empty.yaml
            exit 1
          fi

      - name: Validate digest-format guard fails malformed digest
        run: |
          set +e
          helm template honua ./honua \
            -f honua/ci-values/base.yaml \
            --set image.tag="" \
            --set image.pullPolicy=IfNotPresent \
            --set-string image.digest=sha256:not-a-valid-digest \
            > /tmp/honua-rendered-digest-format-invalid.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected malformed image.digest render to fail."
            cat /tmp/honua-rendered-digest-format-invalid.yaml
            exit 1
          fi

      - name: Validate release.id label guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/ci-values/base.yaml \
            --set-string release.id='Invalid Release Id!' \
            > /tmp/honua-rendered-release-id-invalid.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected invalid release.id render to fail."
            cat /tmp/honua-rendered-release-id-invalid.yaml
            exit 1
          fi

      - name: Validate prod overlay requires an explicit image pin
        run: |
          set +e
          helm template honua-prod ./honua -f honua/values-prod.yaml \
            > /tmp/honua-rendered-prod-unpinned.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected values-prod.yaml without an image pin to fail render."
            cat /tmp/honua-rendered-prod-unpinned.yaml
            exit 1
          fi

      - name: Validate ASPNETCORE_URLS / targetPort mismatch guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/ci-values/base.yaml \
            --set config.env.ASPNETCORE_URLS="http://+:9999" \
            > /tmp/honua-rendered-port-mismatch.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected ASPNETCORE_URLS port not matching service.targetPort to fail."
            cat /tmp/honua-rendered-port-mismatch.yaml
            exit 1
          fi
          grep -q "service.targetPort" /tmp/honua-rendered-port-mismatch.yaml

      - name: Validate derived PostgreSQL password charset guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/values-dev.yaml \
            --set postgresql.auth.password='bad;pass' \
            > /tmp/honua-rendered-pg-password-invalid.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected postgresql.auth.password with ';' to fail when the chart derives the connection string."
            cat /tmp/honua-rendered-pg-password-invalid.yaml
            exit 1
          fi
          grep -q "postgresql.auth.password must not contain" /tmp/honua-rendered-pg-password-invalid.yaml

      - name: Validate derived Redis password charset guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/values-dev.yaml \
            --set-string 'redis.auth.password=bad\,pass' \
            > /tmp/honua-rendered-redis-password-invalid.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected redis.auth.password with ',' to fail when the chart derives the connection string."
            cat /tmp/honua-rendered-redis-password-invalid.yaml
            exit 1
          fi
          grep -q "redis.auth.password must not contain" /tmp/honua-rendered-redis-password-invalid.yaml

      - name: Validate release appVersion label guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/ci-values/base.yaml \
            --set release.appVersion=1.0.0+build \
            > /tmp/honua-rendered-app-version-invalid.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected invalid release.appVersion render to fail."
            cat /tmp/honua-rendered-app-version-invalid.yaml
            exit 1
          fi

      - name: Validate connection encryption master key guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/ci-values/base.yaml \
            --set secret.env.Security__ConnectionEncryption__MasterKey=short \
            > /tmp/honua-rendered-master-key-invalid.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected short Security__ConnectionEncryption__MasterKey render to fail."
            cat /tmp/honua-rendered-master-key-invalid.yaml
            exit 1
          fi
          grep -q "Security__ConnectionEncryption__MasterKey must be at least 32 characters long" \
            /tmp/honua-rendered-master-key-invalid.yaml

      # Each fixture is 16+ characters so it clears the length check and isolates
      # exactly one complexity rule; assert the specific failure message so the
      # individual guards (not just the length short-circuit) are exercised.
      - name: Validate admin password complexity guards fail invalid configs
        run: |
          set -euo pipefail
          assert_admin_pw_fails() {
            password="$1"
            expected="$2"
            set +e
            out=$(helm template honua ./honua \
              -f honua/ci-values/base.yaml \
              --set-string "secret.env.HONUA_ADMIN_PASSWORD=${password}" 2>&1)
            status=$?
            set -e
            if [[ "${status}" -eq 0 ]]; then
              echo "Expected HONUA_ADMIN_PASSWORD '${password}' to fail render."
              echo "${out}"
              exit 1
            fi
            if ! echo "${out}" | grep -q "${expected}"; then
              echo "Expected failure message: ${expected}"
              echo "Got: ${out}"
              exit 1
            fi
          }
          # Too short (length check).
          assert_admin_pw_fails 'Weak1!' \
            "HONUA_ADMIN_PASSWORD must be at least 16 characters long"
          # 16+ chars, each missing exactly one required character class.
          assert_admin_pw_fails 'ciadminpassword1!' \
            "HONUA_ADMIN_PASSWORD must contain at least one uppercase letter"
          assert_admin_pw_fails 'CIADMINPASSWORD1!' \
            "HONUA_ADMIN_PASSWORD must contain at least one lowercase letter"
          assert_admin_pw_fails 'CiAdminPasswordX!' \
            "HONUA_ADMIN_PASSWORD must contain at least one digit"
          assert_admin_pw_fails 'CiAdminPassword12' \
            "HONUA_ADMIN_PASSWORD must contain at least one special character"

      - name: Validate Redis connection guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/ci-values/base.yaml \
            --set secret.env.ConnectionStrings__redis= \
            > /tmp/honua-rendered-redis-missing.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected missing ConnectionStrings__redis render to fail."
            cat /tmp/honua-rendered-redis-missing.yaml
            exit 1
          fi

      - name: Validate observability-without-receiver guard fails invalid config
        run: |
          set +e
          helm template honua ./honua \
            -f honua/ci-values/base.yaml \
            --set config.env.HONUA_OPENTELEMETRY=true \
            > /tmp/honua-rendered-observability-no-receiver.yaml 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Expected observability enabled without a receiver to fail."
            cat /tmp/honua-rendered-observability-no-receiver.yaml
            exit 1
          fi
          grep -q "no telemetry receiver is configured" /tmp/honua-rendered-observability-no-receiver.yaml

      # Exercise the operator-run AKS smoke harness in its no-cluster mode so the
      # harness itself (not just the overlays) cannot rot. --dry-run runs
      # lint + template + kubeconform against the AKS overlays and contacts no
      # cluster. The live AKS path is operator-run via aks-smoke.yml.
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: AKS smoke harness dry-run (no cluster)
        run: |
          scripts/aks-smoke.sh --dry-run \
            --image-tag "$(helm show chart honua | awk -F': ' '/^appVersion:/ {print $2}')-aot" \
            --evidence-dir /tmp/aks-smoke-dryrun

      - name: Upload AKS smoke dry-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aks-smoke-dryrun
          path: /tmp/aks-smoke-dryrun
          if-no-files-found: warn

  install-upgrade-rollback-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          cluster_name: honua-smoke

      - name: Update dependencies
        run: helm dependency update honua

      - name: Start PostGIS
        run: |
          set -euo pipefail

          kubectl create namespace honua-smoke
          cat <<'YAML' | kubectl apply -n honua-smoke -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: honua-postgis
            labels:
              app.kubernetes.io/name: honua-postgis
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: honua-postgis
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: honua-postgis
              spec:
                containers:
                  - name: postgis
                    image: postgis/postgis:16-3.4-alpine
                    ports:
                      - containerPort: 5432
                    env:
                      - name: POSTGRES_USER
                        value: honua
                      - name: POSTGRES_PASSWORD
                        value: ci-password
                      - name: POSTGRES_DB
                        value: honua
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: honua-postgis
          spec:
            selector:
              app.kubernetes.io/name: honua-postgis
            ports:
              - name: postgresql
                port: 5432
                targetPort: 5432
          YAML

          kubectl rollout status deployment/honua-postgis -n honua-smoke --timeout=180s
          for i in {1..60}; do
            if kubectl exec deployment/honua-postgis -n honua-smoke -- pg_isready -h 127.0.0.1 -U honua -d honua; then
              exit 0
            fi
            sleep 2
          done
          echo "PostGIS did not become ready."
          exit 1

      - name: Start Redis
        run: |
          set -euo pipefail

          cat <<'YAML' | kubectl apply -n honua-smoke -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: honua-redis
            labels:
              app.kubernetes.io/name: honua-redis
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: honua-redis
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: honua-redis
              spec:
                containers:
                  - name: redis
                    image: redis:7-alpine
                    args:
                      - redis-server
                      - --appendonly
                      - "no"
                      - --save
                      - ""
                      - --requirepass
                      - ci-redis-password
                    ports:
                      - containerPort: 6379
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: honua-redis
          spec:
            selector:
              app.kubernetes.io/name: honua-redis
            ports:
              - name: redis
                port: 6379
                targetPort: 6379
          YAML

          kubectl rollout status deployment/honua-redis -n honua-smoke --timeout=180s
          for i in {1..60}; do
            if kubectl exec deployment/honua-redis -n honua-smoke -- redis-cli -h 127.0.0.1 --no-auth-warning -a ci-redis-password ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          echo "Redis did not become ready."
          exit 1

      - name: Install, upgrade, test, and rollback
        run: |
          set -euo pipefail
          mkdir -p /tmp/honua-smoke

          helm install honua ./honua -n honua-smoke -f honua/ci-values/upgrade-base.yaml --wait --timeout 10m
          helm test honua -n honua-smoke --logs --timeout 5m | tee /tmp/honua-smoke/test-install.log

          helm upgrade honua ./honua -n honua-smoke -f honua/ci-values/upgrade-target.yaml --wait --timeout 10m
          helm test honua -n honua-smoke --logs --timeout 5m | tee /tmp/honua-smoke/test-upgrade.log

          helm rollback honua 1 -n honua-smoke --wait --timeout 10m
          helm test honua -n honua-smoke --logs --timeout 5m | tee /tmp/honua-smoke/test-rollback.log

      - name: Capture smoke evidence
        if: always()
        run: |
          set +e
          mkdir -p /tmp/honua-smoke
          helm history honua -n honua-smoke > /tmp/honua-smoke/helm-history.txt
          helm get notes honua -n honua-smoke > /tmp/honua-smoke/helm-notes.txt
          kubectl get configmap honua-honua-release-info -n honua-smoke -o yaml > /tmp/honua-smoke/release-info.yaml
          kubectl get events -n honua-smoke --sort-by=.lastTimestamp > /tmp/honua-smoke/events.txt
          kubectl get pods -n honua-smoke -o wide > /tmp/honua-smoke/pods.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: honua-smoke-evidence
          path: /tmp/honua-smoke
