# Honua chart default values.
#
# These defaults render a secure single-pod workload. A runnable install also
# needs database credentials and an admin password supplied through secret.env,
# an existing secret, or extraEnvFrom. See docs/values-contract.md for the
# required/optional values contract and environment overlay guidance.

# Used only when autoscaling.enabled is false.
replicaCount: 1

# Honua Server image. For production, override image.tag with a published
# release tag instead of relying on the moving latest-aot tag.
image:
  repository: ghcr.io/honua-io/honua-server
  tag: "latest-aot"
  pullPolicy: Always
  pullSecrets: []

# Optional name overrides for Kubernetes resources. Leave empty unless the
# release name would exceed DNS label limits or a platform naming standard
# requires an override.
nameOverride: ""
fullnameOverride: ""

# ServiceAccount for the workload. Token automount is disabled by default
# because the server does not need Kubernetes API access.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

# Pod-level extension points for scheduling, observability, and platform labels.
podAnnotations: {}
podLabels: {}

# Baseline pod and container security settings. Keep these restrictive unless
# an image or platform requirement proves a specific relaxation is needed.
podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Cluster Service exposed to other Kubernetes resources.
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Ingress is disabled by default because class, host, TLS, and annotations are
# platform-specific. Environment overlays provide stage/prod examples.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: honua.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Default requests and limits are sized for a small preview install. Increase
# them for production geospatial workloads after measuring workload behavior.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Health probes use Honua Server's HTTP health endpoints. Readiness checks the
# application path that depends on backend availability.
livenessProbe:
  httpGet:
    path: /healthz/live
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz/live
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# HorizontalPodAutoscaler. When enabled, at least one target utilization value
# must be greater than 0; the chart validates this at render time.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

nodeSelector: {}

tolerations: []

affinity: {}

# Chart-managed ConfigMap. Set config.create=false and config.name to reference
# an externally managed ConfigMap instead.
config:
  create: true
  name: ""
  env:
    HONUA_ADMIN_UI: "false"
    HONUA_SERVE_ADMIN_UI: "true"
    HONUA_OBSERVABILITY: "false"
    HONUA_OPENTELEMETRY: "false"
    HONUA_SKIP_MIGRATIONS: "false"
    Deployment__Mode: "SingleInstance"
    Public__BaseUrl: ""
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:8080"

# Chart-managed Secret. When secret.create=true, ConnectionStrings__DefaultConnection
# and HONUA_ADMIN_PASSWORD are required unless the PostgreSQL subchart supplies
# the database connection string. Empty strings are omitted before validation.
# When secret.create=false, provide secret.name or at least one extraEnvFrom
# source that supplies the required runtime variables.
secret:
  create: true
  name: ""
  env:
    ConnectionStrings__DefaultConnection: ""
    HONUA_ADMIN_PASSWORD: ""
    ConnectionStrings__redis: ""

# Additional container environment and source references for platform-managed
# values such as CSI Secret Store, External Secrets Operator, or Downward API.
extraEnv: []
extraEnvFrom: []

# Additional volumes and mounts for platform integrations such as trust bundles
# or mounted secret providers.
extraVolumes: []
extraVolumeMounts: []

# Optional Bitnami PostgreSQL dependency. This is development-only because the
# subchart does not include PostGIS; production should use an external
# PostGIS-enabled database and provide ConnectionStrings__DefaultConnection.
postgresql:
  enabled: false
  auth:
    username: ""
    password: ""
    database: ""

# Optional Bitnami Redis dependency. When redis.enabled=true and no explicit
# ConnectionStrings__redis is supplied, redis.auth.enabled and redis.auth.password
# must be set so the chart can derive the Redis connection string.
redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: true
    password: ""
