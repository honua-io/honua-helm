# Honua chart default values.
#
# These defaults define the baseline values contract and restricted pod posture.
# They intentionally leave required runtime secret values empty, so values.yaml
# alone is not an installable values file. Supply secret.env, an existing
# secret, extraEnvFrom, or an environment overlay. See docs/values-contract.md
# for required/optional values and overlay guidance.

# Used only when autoscaling.enabled is false.
replicaCount: 1

# Honua Server image. For production, prefer image.digest with image.tag left
# empty. If digest pinning is not available, override image.tag with an
# immutable release tag instead of relying on the moving latest-aot tag.
image:
  repository: ghcr.io/honua-io/honua-server
  tag: "latest-aot"
  digest: ""
  pullPolicy: Always
  pullSecrets: []

release:
  id: ""
  manifest: ""
  digest: ""
  appVersion: ""

# Optional name overrides for Kubernetes resources. Leave empty unless the
# release name would exceed DNS label limits or a platform naming standard
# requires an override.
nameOverride: ""
fullnameOverride: ""

# ServiceAccount for the workload. Token automount is disabled by default
# because the server does not need Kubernetes API access.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

# Pod-level extension points for scheduling, observability, and platform labels.
podAnnotations: {}
podLabels: {}

# Baseline pod and container security settings. Keep these restrictive unless
# an image or platform requirement proves a specific relaxation is needed.
podSecurityContext:
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Cluster Service exposed to other Kubernetes resources.
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Ingress is disabled by default because class, host, TLS, and annotations are
# platform-specific. Environment overlays provide stage/prod examples.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: honua.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Default requests and limits are sized for a small preview install. Increase
# them for production geospatial workloads after measuring workload behavior.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Health probes use Honua Server's HTTP health endpoints. Readiness checks the
# application path that depends on backend availability.
livenessProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

strategy:
  type: Recreate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

terminationGracePeriodSeconds: 60

# Writable scratch volume. securityContext.readOnlyRootFilesystem is true, so the
# container filesystem is read-only except for mounts. .NET and geospatial code
# paths write to /tmp (temp files, shadow copies, GDAL scratch), which would hit
# EROFS without a writable mount. This mounts an emptyDir at /tmp. Disable only
# if you have proven the image never writes to disk.
tmpVolume:
  enabled: true
  # Optional emptyDir size cap, e.g. "1Gi". Empty means no limit.
  sizeLimit: ""

preflight:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.5.0"
    pullPolicy: IfNotPresent
  timeoutSeconds: 5
  registryCheck:
    enabled: true

# HorizontalPodAutoscaler. When enabled, at least one target utilization value
# must be greater than 0; the chart validates this at render time.
#
# Horizontal scale-out is only coherent in MultiNode mode. The chart fails at
# render time if autoscaling.enabled is true while
# config.env.Deployment__Mode is "SingleInstance" (the default). To run
# autoscaled HA, set Deployment__Mode: "MultiNode" and also supply
# ConnectionStrings__redis plus a shared cloud FileStorage:Provider (AwsS3 or
# AzureBlob; Local is rejected in MultiNode).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

# PodDisruptionBudget for the Honua Deployment. It protects multi-replica
# workloads from full eviction during voluntary disruptions (node drains,
# cluster upgrades). When enabled is null (the default), a PDB is rendered
# automatically whenever the workload runs more than one pod (autoscaling.enabled
# or replicaCount > 1); set enabled to true/false to force it on or off. Set
# exactly one of minAvailable or maxUnavailable; when both are null the chart
# defaults to maxUnavailable: 25%.
podDisruptionBudget:
  enabled: null
  minAvailable: null
  maxUnavailable: null

nodeSelector: {}

tolerations: []

# Pod affinity/anti-affinity. When left empty, the chart applies a soft
# (preferred) pod anti-affinity spreading replicas across nodes for multi-replica
# workloads (autoscaling.enabled or replicaCount > 1), so a single node drain
# does not take out the whole fleet or stall against the auto-rendered PDB. Set
# an explicit affinity here to fully override that default.
affinity: {}

# Chart-managed ConfigMap. Set config.create=false and config.name to reference
# an externally managed ConfigMap instead.
config:
  create: true
  name: ""
  env:
    HONUA_OBSERVABILITY: "false"
    HONUA_OPENTELEMETRY: "false"
    HONUA_SKIP_MIGRATIONS: "false"
    # SingleInstance runs one coordinated server. Set MultiNode for horizontally
    # scaled HA; MultiNode additionally requires ConnectionStrings__redis and a
    # shared cloud FileStorage:Provider (AwsS3 or AzureBlob). Enabling autoscaling
    # while this is SingleInstance fails render (see autoscaling above).
    Deployment__Mode: "SingleInstance"
    Public__BaseUrl: ""
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:8080"

# Chart-managed Secret. When secret.create=true, HONUA_ADMIN_PASSWORD and
# Security__ConnectionEncryption__MasterKey are required. Non-development
# deployments also require ConnectionStrings__DefaultConnection and
# ConnectionStrings__redis unless the PostgreSQL or Redis subcharts derive those
# connection strings. Empty strings are omitted before validation.
# When secret.create=false, provide secret.name or at least one extraEnvFrom
# source that supplies the required runtime variables.
secret:
  create: true
  name: ""
  env:
    ConnectionStrings__DefaultConnection: ""
    HONUA_ADMIN_PASSWORD: ""
    Security__ConnectionEncryption__MasterKey: ""
    ConnectionStrings__redis: ""

# Additional container environment and source references for platform-managed
# values such as CSI Secret Store, External Secrets Operator, or Downward API.
extraEnv: []
extraEnvFrom: []

# Additional volumes and mounts for platform integrations such as trust bundles
# or mounted secret providers.
extraVolumes: []
extraVolumeMounts: []

# Observability. Honua Server emits OpenTelemetry traces/metrics when
# config.env.HONUA_OPENTELEMETRY (or HONUA_OBSERVABILITY) is "true". Those signals
# need a receiver: set observability.otlpEndpoint to an OpenTelemetry collector,
# or enable a metrics.serviceMonitor / metrics.serviceAnnotations scrape target.
# The chart fails render if observability is enabled with no receiver configured
# (see templates/validations.yaml), so prod/stage cannot ship "blind".
observability:
  # OTLP exporter endpoint (OpenTelemetry collector). When set, the chart injects
  # the standard OTEL_EXPORTER_OTLP_ENDPOINT/OTEL_EXPORTER_OTLP_PROTOCOL env vars
  # so the server's OpenTelemetry SDK exports to the collector.
  # Example: http://otel-collector.observability.svc:4317
  otlpEndpoint: ""
  # OTLP protocol: "grpc" (default, port 4317) or "http/protobuf" (port 4318).
  otlpProtocol: "grpc"

# Prometheus metrics integration. These resources require the Prometheus Operator
# CRDs (ServiceMonitor/PrometheusRule) and/or a Prometheus that honors scrape
# annotations, plus a server build that exposes a Prometheus endpoint at the
# configured port/path. All are opt-in (disabled by default) so the chart renders
# on clusters without the Prometheus Operator.
metrics:
  # Prometheus Operator ServiceMonitor scraping the server metrics endpoint.
  serviceMonitor:
    enabled: false
    # Service port name to scrape (the chart Service names its port "http").
    port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels so a Prometheus Operator release selector can adopt this.
    labels: {}
  # Prometheus scrape annotations on the Service (for non-Operator Prometheus
  # that discovers targets via prometheus.io/* annotations).
  serviceAnnotations:
    enabled: false
    path: /metrics
  # PrometheusRule with baseline availability alerts (zero available replicas,
  # crash-looping). These alert on kube-state-metrics series, so they do not
  # depend on any application metric being emitted yet.
  prometheusRule:
    enabled: false
    labels: {}

# Optional Bitnami PostgreSQL dependency. This is development-only because the
# subchart does not include PostGIS; production should use an external
# PostGIS-enabled database and provide ConnectionStrings__DefaultConnection.
postgresql:
  enabled: false
  auth:
    username: ""
    password: ""
    database: ""

# Optional chart-managed Bitnami Redis dependency. Non-development deployments
# require Redis for durable feature-change event storage. With chart-managed
# secrets, either set secret.env.ConnectionStrings__redis or provide
# redis.auth.password so the chart can derive the Redis connection string.
redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: true
    password: ""
