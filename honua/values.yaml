# Honua chart default values.
#
# These defaults define the baseline values contract and restricted pod posture.
# They intentionally leave required runtime secret values empty, so values.yaml
# alone is not an installable values file. Supply secret.env, an existing
# secret, extraEnvFrom, or an environment overlay. See docs/values-contract.md
# for required/optional values and overlay guidance.

# Used only when autoscaling.enabled is false.
replicaCount: 1

# Honua Server image. For production, prefer image.digest with image.tag left
# empty. If digest pinning is not available, override image.tag with an
# immutable release tag instead of relying on the moving latest-aot tag.
image:
  repository: ghcr.io/honua-io/honua-server
  tag: "latest-aot"
  digest: ""
  pullPolicy: Always
  pullSecrets: []

release:
  id: ""
  manifest: ""
  digest: ""
  appVersion: ""

# Optional name overrides for Kubernetes resources. Leave empty unless the
# release name would exceed DNS label limits or a platform naming standard
# requires an override.
nameOverride: ""
fullnameOverride: ""

# ServiceAccount for the workload. Token automount is disabled by default
# because the server does not need Kubernetes API access.
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

# Pod-level extension points for scheduling, observability, and platform labels.
podAnnotations: {}
podLabels: {}

# Baseline pod and container security settings. Keep these restrictive unless
# an image or platform requirement proves a specific relaxation is needed.
podSecurityContext:
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Cluster Service exposed to other Kubernetes resources.
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Ingress is disabled by default because class, host, TLS, and annotations are
# platform-specific. Environment overlays provide stage/prod examples.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: honua.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Default requests and limits are sized for a small preview install. Increase
# them for production geospatial workloads after measuring workload behavior.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Health probes use Honua Server's HTTP health endpoints. Readiness checks the
# application path that depends on backend availability.
livenessProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /healthz/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

strategy:
  type: Recreate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

terminationGracePeriodSeconds: 60

# Container lifecycle hooks (passed through verbatim to the honua container).
#
# Zero-downtime rollouts (strategy.type: RollingUpdate, and HPA scale-down)
# need a preStop delay. When a pod is terminated, Kubernetes sends SIGTERM and
# removes the Service endpoint concurrently; endpoint removal is asynchronous
# and takes time to propagate to kube-proxy and ingress controllers. Without a
# preStop pause the server can start shutting down while kube-proxy still routes
# new connections to it, so requests in the propagation window get
# connection-refused/reset. terminationGracePeriodSeconds bounds the kill but
# does NOT close this race.
#
# A preStop sleep holds the container running (the pod stays Terminating) so the
# endpoint deletion has time to propagate before the process receives SIGTERM.
# Keep the sleep shorter than terminationGracePeriodSeconds. Recommended for any
# RollingUpdate / autoscaled (MultiNode) deployment:
#
# lifecycle:
#   preStop:
#     exec:
#       command: ["/bin/sh", "-c", "sleep 5"]
#
# Left empty by default because the chart's default strategy is Recreate
# (old pods stop before new pods start), where a preStop delay only slows
# termination without benefit.
lifecycle: {}

# Writable scratch volume. securityContext.readOnlyRootFilesystem is true, so the
# container filesystem is read-only except for mounts. .NET and geospatial code
# paths write to /tmp (temp files, shadow copies, GDAL scratch), which would hit
# EROFS without a writable mount. This mounts an emptyDir at /tmp. Disable only
# if you have proven the image never writes to disk.
tmpVolume:
  enabled: true
  # Optional emptyDir size cap, e.g. "1Gi". Empty means no limit.
  sizeLimit: ""

preflight:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.5.0"
    pullPolicy: IfNotPresent
  timeoutSeconds: 5
  # The preflight hook runs with backoffLimit: 0 (a single Pod attempt), so a
  # transient DNS/egress/registry blip during the probe would abort the whole
  # install/upgrade. To absorb such blips, each reachability probe (database,
  # Redis, registry) is retried in-script up to `retries` times with
  # `retryDelaySeconds` between attempts before the hook fails. Set retries to 1
  # to disable retrying.
  retries: 3
  retryDelaySeconds: 3
  registryCheck:
    enabled: true

# HorizontalPodAutoscaler. When enabled, at least one target utilization value
# must be greater than 0; the chart validates this at render time.
#
# Memory-based autoscaling is OFF by default (targetMemoryUtilizationPercentage:
# 0). The .NET server-GC heap holds onto committed memory and rarely releases it
# back to the OS, so a memory utilization target tends to ratchet replicas up to
# maxReplicas and then never scale them back down -- defeating elastic
# scale-down. Default to CPU-only scaling and opt into memory scaling
# deliberately (set targetMemoryUtilizationPercentage > 0) only after confirming
# the workload's memory actually tracks load.
#
# Horizontal scale-out is only coherent in MultiNode mode. The chart fails at
# render time if autoscaling.enabled is true while
# config.env.Deployment__Mode is "SingleInstance" (the default). To run
# autoscaled HA, set Deployment__Mode: "MultiNode" and also supply
# ConnectionStrings__redis plus a shared cloud FileStorage:Provider (AwsS3 or
# AzureBlob; Local is rejected in MultiNode).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 0
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

# PodDisruptionBudget for the Honua Deployment. It protects multi-replica
# workloads from full eviction during voluntary disruptions (node drains,
# cluster upgrades). When enabled is null (the default), a PDB is rendered
# automatically whenever the workload runs more than one pod (autoscaling.enabled
# or replicaCount > 1); set enabled to true/false to force it on or off. Set
# exactly one of minAvailable or maxUnavailable; when both are null the chart
# defaults to maxUnavailable: 1. (An absolute 1 is used rather than a percentage
# because Kubernetes rounds a percentage maxUnavailable down, so 25% of 2-3
# replicas is 0, which blocks all evictions and hangs node drains.)
podDisruptionBudget:
  enabled: null
  minAvailable: null
  maxUnavailable: null

nodeSelector: {}

tolerations: []

# Pod affinity/anti-affinity. When left empty, the chart applies a soft
# (preferred) pod anti-affinity spreading replicas across nodes for multi-replica
# workloads (autoscaling.enabled or replicaCount > 1), so a single node drain
# does not take out the whole fleet or stall against the auto-rendered PDB. Set
# an explicit affinity here to fully override that default.
affinity: {}

# Chart-managed ConfigMap. Set config.create=false and config.name to reference
# an externally managed ConfigMap instead.
config:
  create: true
  name: ""
  env:
    HONUA_OBSERVABILITY: "false"
    HONUA_OPENTELEMETRY: "false"
    HONUA_SKIP_MIGRATIONS: "false"
    # SingleInstance runs one coordinated server. Set MultiNode for horizontally
    # scaled HA; MultiNode additionally requires ConnectionStrings__redis and a
    # shared cloud FileStorage:Provider (AwsS3 or AzureBlob). Enabling autoscaling
    # while this is SingleInstance fails render (see autoscaling above).
    Deployment__Mode: "SingleInstance"
    Public__BaseUrl: ""
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:8080"

# Chart-managed Secret. When secret.create=true, HONUA_ADMIN_PASSWORD and
# Security__ConnectionEncryption__MasterKey are required. Non-development
# deployments also require ConnectionStrings__DefaultConnection and
# ConnectionStrings__redis unless the PostgreSQL or Redis subcharts derive those
# connection strings. Empty strings are omitted before validation.
# When secret.create=false, provide secret.name or at least one extraEnvFrom
# source that supplies the required runtime variables.
secret:
  create: true
  name: ""
  env:
    ConnectionStrings__DefaultConnection: ""
    HONUA_ADMIN_PASSWORD: ""
    Security__ConnectionEncryption__MasterKey: ""
    ConnectionStrings__redis: ""

# Additional container environment and source references for platform-managed
# values such as CSI Secret Store, External Secrets Operator, or Downward API.
extraEnv: []
extraEnvFrom: []

# Additional volumes and mounts for platform integrations such as trust bundles
# or mounted secret providers.
extraVolumes: []
extraVolumeMounts: []

# Observability. Honua Server emits OpenTelemetry traces/metrics when
# config.env.HONUA_OPENTELEMETRY (or HONUA_OBSERVABILITY) is "true". Those signals
# need a receiver: set observability.otlpEndpoint to an OpenTelemetry collector,
# or enable a metrics.serviceMonitor / metrics.serviceAnnotations scrape target.
# The chart fails render if observability is enabled with no receiver configured
# (see templates/validations.yaml), so prod/stage cannot ship "blind".
observability:
  # OTLP exporter endpoint (OpenTelemetry collector). When set, the chart injects
  # the standard OTEL_EXPORTER_OTLP_ENDPOINT/OTEL_EXPORTER_OTLP_PROTOCOL env vars
  # so the server's OpenTelemetry SDK exports to the collector.
  # Example: http://otel-collector.observability.svc:4317
  otlpEndpoint: ""
  # OTLP protocol: "grpc" (default, port 4317) or "http/protobuf" (port 4318).
  otlpProtocol: "grpc"

# Prometheus metrics integration. These resources require the Prometheus Operator
# CRDs (ServiceMonitor/PrometheusRule) and/or a Prometheus that honors scrape
# annotations, plus a server build that exposes a Prometheus endpoint at the
# configured port/path. All are opt-in (disabled by default) so the chart renders
# on clusters without the Prometheus Operator.
metrics:
  # Prometheus Operator ServiceMonitor scraping the server metrics endpoint.
  serviceMonitor:
    enabled: false
    # Service port name to scrape (the chart Service names its port "http").
    port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels so a Prometheus Operator release selector can adopt this.
    labels: {}
  # Prometheus scrape annotations on the Service (for non-Operator Prometheus
  # that discovers targets via prometheus.io/* annotations).
  serviceAnnotations:
    enabled: false
    path: /metrics
  # PrometheusRule with baseline availability alerts (zero available replicas,
  # crash-looping) plus opt-in application SLO alerts. The baseline alerts read
  # kube-state-metrics series, so they do not depend on any application metric.
  prometheusRule:
    enabled: false
    labels: {}
    # Application SLO alerts. The budgeted ratio is
    #
    #   sum(rate(honua_request_error_total{...,in_band="true"}[w])
    #       or rate(honua_request_error_total{...,error_code=~"5.."}[w]))
    #     / clamp_min(sum(rate(honua_serving_request_duration_ms_count{...}[w])), 0.001)
    #
    # Numerator — transport 5xx plus every in-band error. "In-band" means the error
    # envelope was delivered with a non-error HTTP status: GeoServices returns HTTP
    # 200 with an {error} body for Esri-client compatibility, so a load-balancer or
    # transport-5xx metric cannot see those failures at all. Ordinary out-of-band
    # 4xx is deliberately EXCLUDED — an Esri client probing capabilities and
    # collecting 404s is normal behaviour and must not burn an availability budget.
    # The two selectors are disjoint, because in_band is defined as HTTP < 400.
    # `or` rather than `+`: PromQL arithmetic drops any group missing from either
    # side, so `+` would yield nothing whenever there are in-band errors but no 5xx.
    # Caveat: an in-band error cannot yet be attributed to client vs server fault,
    # so all of them count. That is intentional — an in-band error storm is the
    # failure these alerts exist for — but it is not a fault-attributed SLO.
    #
    # Denominator — honua_serving_request_duration_ms_count is the _count child of
    # the server's serving-plane latency histogram: one sample per served request
    # that classifies to a Honua protocol, excluding health probes and the metrics
    # scrape. So it is "classified serving-plane requests", not "all HTTP requests".
    # It is not the only request-volume series available — OpenTelemetry's ASP.NET
    # Core instrumentation also exports http_server_request_duration_seconds_count
    # for every HTTP request — but that series carries no Honua protocol label, so a
    # protocol-scoped budget cannot be expressed with it.
    #
    # Scope — inBandErrors narrows the denominator to the GeoServices protocol
    # family so a GeoServices regression is not diluted by healthy traffic on other
    # protocols. A ratio whose denominator is broader than its numerator understates
    # the error rate, which is how an error budget ends up failing open.
    #
    # honua-server's observability/slo-metric-contract.json is the canonical list of
    # names and scopes, and honua-release's gate-observability fails if these rules
    # drift from it — a ratio over a series nobody emits is an empty PromQL vector,
    # which produces no alert and no error (honua-release#5).
    #
    # Mirrors the honua-devops SLO recording rules.
    slo:
      enabled: true
      # Optional label matcher fragment scoping the series to this deployment,
      # e.g. 'cluster="prod",service="honua-server"'. Empty automatically uses
      # the Prometheus Operator target labels for this release:
      # namespace="<release namespace>",service="<release fullname>". Set an
      # explicit selector when a custom scraper uses different target labels.
      # Only Prometheus target labels belong here — the server's own labels are
      # service_type/operation/error_code/in_band on the error counter and
      # honua_protocol/honua_operation/status_class on the duration histogram.
      metricSelector: ""
      # Extra labels merged onto every SLO alert (identity + Alertmanager routing).
      alertLabels:
        service: honua-server
      runbookUrl: "https://github.com/honua-io/honua-devops/blob/main/docs/slo-release-gates.md"
      # Error budget: the fraction of requests allowed to error. It is the burn-rate
      # denominator (burn rate = observed error ratio / errorBudget).
      errorBudget: 0.010
      # Rolling request-availability alert (1 - error ratio) < target.
      availability:
        enabled: true
        target: 0.990
        window: 30d
        for: 10m
        severity: critical
        route: pagerduty-critical
      # Short-window budgeted error rate: transport 5xx AND in-band 200-with-{error},
      # excluding ordinary out-of-band 4xx.
      errorRate:
        enabled: true
        threshold: 0.010
        window: 5m
        for: 10m
        severity: warning
        route: slack-warning
      # Dedicated GeoServices 200-with-{error} in-band signal so the LB-invisible
      # error class is never masked by a healthy transport (5xx) picture. Both sides
      # of this ratio are scoped to the GeoServices protocol family.
      inBandErrors:
        enabled: true
        threshold: 0.010
        window: 5m
        for: 10m
        severity: warning
        route: slack-warning
      # Multi-window error-budget burn-rate alerts (fast/medium/slow).
      burnRate:
        enabled: true
        fast:
          threshold: 14.4
          window: 5m
          for: 5m
          severity: critical
          route: pagerduty-critical
        medium:
          threshold: 6.0
          window: 30m
          for: 15m
          severity: warning
          route: slack-warning
        slow:
          threshold: 3.0
          window: 6h
          for: 30m
          severity: warning
          route: email-info
      # Operator-supplied rules appended verbatim to the honua.slo group.
      extraRules: []
  # AlertmanagerConfig receiver/route surface (monitoring.coreos.com/v1alpha1).
  # This wires WHERE the alerts above are delivered (PagerDuty/Slack/email/...);
  # the Alertmanager Operator merges it by namespace/label selector. It does NOT
  # deploy Alertmanager. Disabled by default; at least one receiver is required
  # when enabled. The SLO alerts carry `severity` and `route` labels that a route
  # can match on (e.g. route.matchers: [{name: route, value: pagerduty-critical}]).
  alertmanagerConfig:
    enabled: false
    # Extra labels so the Alertmanager `alertmanagerConfigSelector` can adopt this.
    labels: {}
    annotations: {}
    # Pass-through AlertmanagerConfig spec.route (matchers, groupBy, receiver, ...).
    route: {}
    # Pass-through AlertmanagerConfig spec.receivers (each: name + *Configs list).
    receivers: []
    # Optional pass-through spec.inhibitRules.
    inhibitRules: []

# Registers this chart's installed Deployment as a stable target with Honua
# Server's control plane, so the deploy/rollback surfaces
# (/api/v1/admin/deploy/preflight, the deploy.rollback capability manifest)
# see a target to plan against instead of finding nothing registered. This
# does not add automatic rollback: the only backend this chart wires up is
# the Honua GitOps hand-off backend, which always reports
# SupportsRollback=false and requires an operator to recover out of band
# (helm rollback, see docs/contract.md). See docs/contract.md for the full
# registration and upgrade-safety contract.
controlPlane:
  deployTarget:
    # Set to false to opt this installation out of target registration
    # entirely (for example a preview namespace that should not appear in
    # control-plane deploy tooling).
    enabled: true
    # Stable identifier used by the control-plane API and workers. Empty uses
    # the chart's fullname so each release registers a distinct target.
    targetId: ""
    # Backend adapter that executes deploy/rollback operations for this
    # target. Only "honua-gitops-kubernetes" is truthful for a plain chart
    # install: it is a hand-off backend with SupportsRollback=false. The
    # chart fails render if this is changed to any other value, because no
    # other backend's prerequisites (RBAC, CRDs, controller) are wired up by
    # this chart yet.
    backend: "honua-gitops-kubernetes"
    # Environment/stage label surfaced on the target. Empty uses
    # config.env.ASPNETCORE_ENVIRONMENT (see honua.runtimeEnvironment).
    environment: ""
    # Human-readable target name. Empty uses the chart's fullname.
    targetName: ""
    # Stable artifact reference for this target. Empty uses the rendered
    # image reference (repository:tag or repository@digest).
    artifactReference: ""

# Optional Bitnami PostgreSQL dependency. This is development-only because the
# subchart does not include PostGIS; production should use an external
# PostGIS-enabled database and provide ConnectionStrings__DefaultConnection.
postgresql:
  enabled: false
  auth:
    username: ""
    password: ""
    database: ""

# Optional chart-managed Bitnami Redis dependency. Non-development deployments
# require Redis for durable feature-change event storage. With chart-managed
# secrets, either set secret.env.ConnectionStrings__redis or provide
# redis.auth.password so the chart can derive the Redis connection string.
redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: true
    password: ""
