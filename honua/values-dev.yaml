# Development overlay for local clusters and ephemeral preview namespaces.
# This overlay is self-contained for Helm rendering and development smoke tests.
# The bundled PostgreSQL dependency is not PostGIS-enabled and is not intended
# for production data.

replicaCount: 1

image:
  # Candidate image validated for the 2026.1 development quick start.
  tag: ""
  digest: "sha256:3ef3bd41a2f84d1f3a6194c11db496f741cc4d869b54bf57e9d7067dd9cf3d39"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

config:
  env:
    HONUA_OBSERVABILITY: "false"
    HONUA_OPENTELEMETRY: "false"
    HONUA_SKIP_MIGRATIONS: "false"
    Deployment__Mode: "SingleInstance"
    Public__BaseUrl: "http://honua.local"
    ASPNETCORE_ENVIRONMENT: "Development"
    ASPNETCORE_URLS: "http://+:8080"

secret:
  env:
    HONUA_ADMIN_PASSWORD: "DevAdminPassword1!"
    Security__ConnectionEncryption__MasterKey: "dev-connection-encryption-master-key-00000001"

postgresql:
  enabled: true
  auth:
    username: honua
    password: honua-dev-password
    database: honua

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: honua-dev-redis
