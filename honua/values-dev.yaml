# Development overlay for local clusters and ephemeral preview namespaces.
# Self-contained: digest-pinned server, chart-managed PostGIS and Redis.
# Credentials are generated at install (secret.generateCredentials) and are not
# stored in this file. Not for production data.

replicaCount: 1

image:
  # Candidate image validated for the 2026.1 development quick start.
  tag: ""
  digest: "sha256:3ef3bd41a2f84d1f3a6194c11db496f741cc4d869b54bf57e9d7067dd9cf3d39"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

config:
  env:
    HONUA_OBSERVABILITY: "false"
    HONUA_OPENTELEMETRY: "false"
    HONUA_SKIP_MIGRATIONS: "false"
    Deployment__Mode: "SingleInstance"
    Public__BaseUrl: "http://honua.local"
    ASPNETCORE_ENVIRONMENT: "Development"
    ASPNETCORE_URLS: "http://+:8080"

secret:
  generateCredentials: true
  env: {}

postgis:
  enabled: true

postgresql:
  enabled: false

redis:
  enabled: true
  persistence:
    enabled: false
  auth:
    enabled: true
    password: ""

tests:
  connection:
    attempts: 60
    sleepSeconds: 10
