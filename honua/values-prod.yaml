# Production overlay for customer-operated deployments.
# Pair this file with a site-specific override for DNS, TLS, image.tag, secret
# name, and provider-specific ingress annotations. The runtime secret must
# contain ConnectionStrings__DefaultConnection, HONUA_ADMIN_PASSWORD, and
# Security__ConnectionEncryption__MasterKey. Redis is required only for MultiNode.
#
# This overlay ships a single-instance deployment (replicaCount: 1,
# Deployment__Mode=SingleInstance) so it is internally consistent and works out
# of the box. The Honua Server does not coordinate multiple replicas in
# SingleInstance mode, so the HorizontalPodAutoscaler is disabled here.
#
# To opt into horizontally scaled HA, supply a site-specific override that:
#   1. sets config.env.Deployment__Mode: "MultiNode";
#   2. enables autoscaling (autoscaling.enabled: true) or raises replicaCount;
#   3. provides ConnectionStrings__redis (shared cache / coordination); and
#   4. configures a shared cloud FileStorage provider — FileStorage:Provider must
#      be AwsS3 or AzureBlob (Local storage is rejected in MultiNode), with the
#      provider's bucket/region or connection-string/container settings.
# The chart fails at render time if autoscaling is enabled while
# Deployment__Mode is SingleInstance, so these settings must change together.

replicaCount: 1

# Production must run a reproducible, immutable image across the whole replica
# fleet. Do NOT use the moving "latest-aot" tag here: every restart/reschedule
# could pull a different build, so replicas in the same Deployment can diverge.
#
# Pin one of the following before deploying:
#   * image.digest (strongest): set image.digest to "sha256:<64 hex>" and leave
#     image.tag empty. pullPolicy must then be IfNotPresent or Never (enforced by
#     the chart). See honua/ci-values/digest.yaml for the shape.
#   * an immutable release tag: override image.tag with a concrete "vX.Y.Z-aot"
#     release tag (the value release CI stamps into values.yaml).
#
# This overlay intentionally clears image.tag so a from-checkout
# "helm install -f values-prod.yaml" cannot silently inherit the mutable
# "latest-aot" tag from values.yaml. With both image.tag and image.digest empty,
# the chart's one-of-tag/digest guard fails render until an operator supplies an
# immutable identity (digest preferred, or a concrete "vX.Y.Z-aot" release tag).
# Release CI stamps the immutable tag into values.yaml on the packaged chart, so
# published chart installs are pinned without further action. pullPolicy is
# IfNotPresent so a pinned identity is not silently re-pulled.
image:
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 1
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi

# Disabled because this overlay runs in SingleInstance mode. Enable only as part
# of a MultiNode HA override (see the header comment) that also supplies Redis
# and a shared cloud FileStorage provider.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: honua.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: honua-prod-tls
      hosts:
        - honua.example.com

config:
  env:
    HONUA_OBSERVABILITY: "true"
    HONUA_OPENTELEMETRY: "true"
    HONUA_SKIP_MIGRATIONS: "false"
    Deployment__Mode: "SingleInstance"
    Public__BaseUrl: "https://honua.example.com"
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:8080"

# Observability is enabled above, so a receiver is required. Point this at your
# OpenTelemetry collector (override the host/port for your cluster). Alternatively
# enable metrics.serviceMonitor / metrics.serviceAnnotations to scrape Prometheus.
observability:
  otlpEndpoint: "http://otel-collector.observability.svc:4317"
  otlpProtocol: "grpc"

secret:
  create: false
  name: honua-prod-runtime

postgresql:
  enabled: false

redis:
  enabled: false
