# Production overlay for customer-operated deployments.
# Pair this file with a site-specific override for DNS, TLS, image.tag, secret
# name, and provider-specific ingress annotations. The runtime secret must
# contain ConnectionStrings__DefaultConnection, HONUA_ADMIN_PASSWORD, and
# ConnectionStrings__redis when Redis is used.

replicaCount: 3

image:
  tag: "latest-aot"
  pullPolicy: Always

resources:
  requests:
    cpu: 1
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: honua.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: honua-prod-tls
      hosts:
        - honua.example.com

config:
  env:
    HONUA_ADMIN_UI: "false"
    HONUA_SERVE_ADMIN_UI: "true"
    HONUA_OBSERVABILITY: "true"
    HONUA_OPENTELEMETRY: "true"
    HONUA_SKIP_MIGRATIONS: "false"
    Deployment__Mode: "SingleInstance"
    Public__BaseUrl: "https://honua.example.com"
    ASPNETCORE_ENVIRONMENT: "Production"
    ASPNETCORE_URLS: "http://+:8080"

secret:
  create: false
  name: honua-prod-runtime

postgresql:
  enabled: false

redis:
  enabled: false
