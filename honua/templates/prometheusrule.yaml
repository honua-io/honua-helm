{{- if .Values.metrics.prometheusRule.enabled }}
{{- $slo := .Values.metrics.prometheusRule.slo | default dict }}
{{- $defaultSel := printf "namespace=%q,service=%q" .Release.Namespace (include "honua.fullname" .) }}
{{- $sel := default $defaultSel (trim (default "" (get $slo "metricSelector"))) }}
{{- $inbandSel := ternary (printf "%s,in_band=\"true\"" $sel) "in_band=\"true\"" (ne $sel "") }}
{{- $fiveXxSel := ternary (printf "%s,error_code=~\"5..\"" $sel) "error_code=~\"5..\"" (ne $sel "") }}
{{- $geoServicesSel := printf "%s,honua_protocol=~\"FeatureServer|MapServer|ImageServer|VectorTileServer|GPServer|NAServer|GeometryService|PrintingTools|StaticMap\"" $sel }}
{{- $budget := $slo.errorBudget | default 0.010 }}
{{- $runbook := $slo.runbookUrl | default "" }}
{{- $alertLabels := $slo.alertLabels | default dict }}
{{- /*
  DENOMINATOR: honua_serving_request_duration_ms_count — the Prometheus _count child of the server's
  serving-plane latency histogram, i.e. one sample per served request that classifies to a Honua
  protocol, excluding health probes and the metrics scrape. The flat honua_http_requests_total these
  rules used to divide by was never emitted by anything, and an absent series does not error in
  PromQL — rate() over it is an empty vector, so every ratio evaluated to nothing and no alert could
  ever fire. The canonical list of names the server exports is honua-server's
  observability/slo-metric-contract.json, and honua-release's gate-observability fails if this file
  drifts from it (honua-release#5).

  It is not the only request-volume series available — OpenTelemetry's ASP.NET Core instrumentation
  also exports http_server_request_duration_seconds_count for every HTTP request. That one is not
  used here because it carries no Honua protocol label, so a protocol-scoped budget cannot be
  expressed with it.

  NUMERATOR: transport 5xx PLUS every in-band (HTTP < 400 body-envelope) error. Not 5xx alone, which
  is blind to the GeoServices 200-with-{error} class these alerts exist for; and not every error
  envelope either, because that counts ordinary 4xx — an Esri client probing capabilities and
  collecting 404s would permanently breach a 99.0% availability target through no fault of the
  platform. The two selectors are disjoint (in_band is defined as error_code < 400).

  `or`, not `+`: PromQL binary arithmetic drops any group missing from either side, so a `+` would
  silently yield nothing whenever a deployment has in-band errors but no 5xx — reintroducing exactly
  the empty-vector silence this change fixes.

  SCOPE: a ratio is only meaningful when the denominator covers the numerator's population.
  HonuaGeoServicesInBandErrorRateHigh therefore narrows the denominator to the GeoServices protocol
  family ($geoServicesSel, mirroring HonuaTelemetry.Protocols.GeoServicesFamily); the all-surface
  alerts leave it unscoped because their numerator is all-surface too.
*/ -}}
{{- $errRatio := printf "(sum(rate(honua_request_error_total{%s}[%%s]) or rate(honua_request_error_total{%s}[%%s]))) / clamp_min(sum(rate(honua_serving_request_duration_ms_count{%s}[%%s])), 0.001)" $inbandSel $fiveXxSel $sel }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "honua.fullname" . }}
  labels:
    {{- include "honua.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: honua.availability
      rules:
        - alert: HonuaNoAvailableReplicas
          expr: 'kube_deployment_status_replicas_available{namespace="{{ .Release.Namespace }}",deployment="{{ include "honua.fullname" . }}"} == 0'
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Honua has no available replicas"
            description: 'Deployment {{ include "honua.fullname" . }} in namespace {{ .Release.Namespace }} has had zero available replicas for 5 minutes.'
        - alert: HonuaPodCrashLooping
          expr: 'increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="honua"}[15m]) > 3'
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Honua container is restarting frequently"
            description: 'A Honua container in namespace {{ .Release.Namespace }} has restarted more than 3 times in 15 minutes.'
{{- if $slo.enabled }}
    - name: honua.slo
      rules:
{{- with $slo.availability }}
{{- if .enabled }}
        - alert: HonuaAvailabilitySloViolation
          expr: '(1 - ({{ printf $errRatio .window .window .window }})) < {{ .target }}'
          for: {{ .for }}
          labels:
            severity: {{ .severity | quote }}
            {{- with .route }}
            route: {{ . | quote }}
            {{- end }}
            {{- with $alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Honua request-availability SLO violation"
            description: 'Rolling {{ .window }} request availability (including GeoServices 200-with-{error} envelopes) is below the {{ .target }} target.'
            {{- with $runbook }}
            runbook_url: {{ . | quote }}
            {{- end }}
{{- end }}
{{- end }}
{{- with $slo.errorRate }}
{{- if .enabled }}
        - alert: HonuaErrorRateHigh
          expr: '({{ printf $errRatio .window .window .window }}) > {{ .threshold }}'
          for: {{ .for }}
          labels:
            severity: {{ .severity | quote }}
            {{- with .route }}
            route: {{ . | quote }}
            {{- end }}
            {{- with $alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Honua error rate above threshold"
            description: 'Combined error rate over {{ .window }} (transport 5xx plus GeoServices in-band 200-with-{error} envelopes) is above {{ .threshold }}.'
            {{- with $runbook }}
            runbook_url: {{ . | quote }}
            {{- end }}
{{- end }}
{{- end }}
{{- with $slo.inBandErrors }}
{{- if .enabled }}
        - alert: HonuaGeoServicesInBandErrorRateHigh
          expr: '(sum(rate(honua_request_error_total{ {{- $inbandSel -}} }[{{ .window }}])) / clamp_min({{ printf "sum(rate(honua_serving_request_duration_ms_count{%s}[%s]))" $geoServicesSel .window }}, 0.001)) > {{ .threshold }}'
          for: {{ .for }}
          labels:
            severity: {{ .severity | quote }}
            {{- with .route }}
            route: {{ . | quote }}
            {{- end }}
            {{- with $alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Honua GeoServices in-band (HTTP 200) error rate high"
            description: 'GeoServices returns HTTP 200 with an {error} body for Esri compatibility, so these failures are invisible to load-balancer 5xx metrics. The in-band error rate over {{ .window }} is above {{ .threshold }}.'
            {{- with $runbook }}
            runbook_url: {{ . | quote }}
            {{- end }}
{{- end }}
{{- end }}
{{- with $slo.burnRate }}
{{- if .enabled }}
{{- range $tier, $cfg := (dict "Fast" .fast "Medium" .medium "Slow" .slow) }}
{{- if $cfg }}
        - alert: HonuaErrorBudget{{ $tier }}Burn
          expr: '(({{ printf $errRatio $cfg.window $cfg.window $cfg.window }}) / {{ $budget }}) > {{ $cfg.threshold }}'
          for: {{ $cfg.for }}
          labels:
            severity: {{ $cfg.severity | quote }}
            {{- with $cfg.route }}
            route: {{ . | quote }}
            {{- end }}
            {{- with $alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Honua error-budget {{ lower $tier }} burn"
            description: 'Error-budget burn over {{ $cfg.window }} (including GeoServices in-band 200-with-{error} envelopes) exceeds {{ $cfg.threshold }}x. Hold promotion and evaluate rollback.'
            {{- with $runbook }}
            runbook_url: {{ . | quote }}
            {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- with $slo.extraRules }}
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
