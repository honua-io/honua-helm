{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "honua.redisHost" . }}
type: Opaque
{{- $redisPassword := include "honua.redisPassword" . }}
{{- /* redis.conf carries requirepass so the password never appears in the
       redis-server argv (/proc/<pid>/cmdline). Escape for a Redis
       double-quoted config string. */}}
{{- $redisConfPassword := $redisPassword | replace "\\" "\\\\" | replace "\"" "\\\"" | replace "\n" "\\n" | replace "\r" "\\r" }}
stringData:
  password: {{ $redisPassword | quote }}
  redis.conf: {{ printf "requirepass \"%s\"\n" $redisConfPassword | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honua.redisHost" . }}
  labels:
    {{- include "honua.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "honua.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      annotations:
        {{- /* Salted with the release identity. Not a raw hash of the password, which a short password could be recovered from. */}}
        checksum/redis-secret: {{ printf "%s/%s/%s" .Release.Namespace .Release.Name $redisPassword | sha256sum | quote }}
      labels:
        {{- include "honua.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      {{- with .Values.redis.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          {{- if dig "enabled" true .Values.redis.persistence }}
          persistentVolumeClaim:
            claimName: {{ include "honua.redisHost" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          secret:
            secretName: {{ include "honua.redisHost" . }}
            defaultMode: 0440
            items:
              - key: redis.conf
                path: redis.conf
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: redis
          image: {{ include "honua.referencedImage" (dict "repository" .Values.redis.image.repository "tag" .Values.redis.image.tag "digest" (default "" .Values.redis.image.digest)) | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- with .Values.redis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - redis-server
            - /usr/local/etc/redis/redis.conf
            - --appendonly
            - "yes"
            {{- with .Values.redis.maxmemory }}
            - --maxmemory
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
            - name: tmp
              mountPath: /tmp
          env:
            # redis-cli reads REDISCLI_AUTH, so probes never pass -a <password>.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "honua.redisHost" . }}
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
---
{{- if dig "enabled" true .Values.redis.persistence }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "honua.redisHost" . }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if ne .Values.redis.persistence.storageClass "" }}
  storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "honua.redisHost" . }}
spec:
  selector:
    {{- include "honua.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
