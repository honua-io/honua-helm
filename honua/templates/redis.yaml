{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "honua.redisHost" . }}
type: Opaque
{{- $redisPassword := required "redis.auth.password is required when redis.enabled is true." .Values.redis.auth.password | toString }}
{{- /* redis.conf carries requirepass so the password never appears in the
       redis-server argv (/proc/<pid>/cmdline). Escape for a Redis
       double-quoted config string. */}}
{{- $redisConfPassword := $redisPassword | replace "\\" "\\\\" | replace "\"" "\\\"" | replace "\n" "\\n" | replace "\r" "\\r" }}
stringData:
  password: {{ $redisPassword | quote }}
  redis.conf: {{ printf "requirepass \"%s\"\n" $redisConfPassword | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honua.redisHost" . }}
  labels:
    {{- include "honua.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "honua.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      annotations:
        checksum/redis-password: {{ .Values.redis.auth.password | sha256sum | quote }}
      labels:
        {{- include "honua.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      {{- with .Values.redis.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "honua.redisHost" . }}
        - name: config
          secret:
            secretName: {{ include "honua.redisHost" . }}
            defaultMode: 0440
            items:
              - key: redis.conf
                path: redis.conf
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          {{- with .Values.redis.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["redis-server", "/usr/local/etc/redis/redis.conf", "--appendonly", "yes"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /usr/local/etc/redis
              readOnly: true
            - name: tmp
              mountPath: /tmp
          env:
            # redis-cli reads REDISCLI_AUTH, so probes never pass -a <password>.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "honua.redisHost" . }}
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli ping | grep -q PONG"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "honua.redisHost" . }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if ne .Values.redis.persistence.storageClass "" }}
  storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "honua.redisHost" . }}
spec:
  selector:
    {{- include "honua.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
