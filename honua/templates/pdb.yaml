{{- $pdb := .Values.podDisruptionBudget | default dict -}}
{{- $explicitlyEnabled := dig "enabled" nil $pdb -}}
{{- $multiReplica := or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1) -}}
{{- $enabled := ternary $multiReplica (eq $explicitlyEnabled true) (eq $explicitlyEnabled nil) -}}
{{- if $enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "honua.fullname" . }}
  labels:
    {{- include "honua.labels" . | nindent 4 }}
    {{- include "honua.releaseLabels" . | nindent 4 }}
spec:
  {{- /* The minAvailable/maxUnavailable mutual-exclusion guard lives in
         templates/validations.yaml; this template only selects which field to
         render. */ -}}
  {{- $minAvailable := dig "minAvailable" nil $pdb -}}
  {{- $maxUnavailable := dig "maxUnavailable" nil $pdb -}}
  {{- if ne $minAvailable nil }}
  minAvailable: {{ $minAvailable }}
  {{- else if ne $maxUnavailable nil }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- else }}
  {{- /*
    Default to an absolute maxUnavailable of 1 rather than a percentage.
    Kubernetes rounds a percentage maxUnavailable DOWN, so 25% of 2-3 replicas
    is 0, which forbids all voluntary evictions and hangs node drains -- the
    opposite of the PDB's drain-protection intent. An absolute 1 keeps small HA
    fleets drainable while still protecting availability.
  */}}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "honua.selectorLabels" . | nindent 6 }}
{{- end }}
