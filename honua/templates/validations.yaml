{{- /*
  Single validation layer for the chart's cross-field / render-time guards.

  Division of responsibility with values.schema.json:
    * values.schema.json owns structural validation -- types, enums, patterns,
      min/max, and the JSON-Schema conditional rules (image tag XOR digest,
      digest pattern, pullPolicy-with-digest, RollingUpdate non-zero budget,
      autoscaling target presence, secret/redis/postgresql requirements). It is
      the first gate and produces schema-level errors.
    * This file owns cross-field render-time checks that JSON Schema cannot
      express well, plus operator-friendly failure messages. Where a rule is
      intentionally enforced in BOTH places (e.g. image tag/digest, the digest
      pattern, autoscaling target presence) the schema is the early structural
      gate and the guard here is the explanatory backstop; keep the two aligned.

  All chart-wide fail-based guards belong here rather than scattered across the
  individual resource templates.
*/ -}}
{{- $secretName := trim (default "" .Values.secret.name) -}}
{{- $hasSecretName := gt (len $secretName) 0 -}}
{{- $hasExtraEnvFrom := gt (len .Values.extraEnvFrom) 0 -}}
{{- $imageTag := trim (default "" .Values.image.tag) -}}
{{- $imageDigest := trim (default "" .Values.image.digest) -}}
{{- $releaseID := trim (default "" .Values.release.id) -}}
{{- $appVersion := trim (include "honua.appVersion" .) -}}
{{- $labelValuePattern := "^[A-Za-z0-9]([A-Za-z0-9_.-]{0,61}[A-Za-z0-9])?$" -}}

{{- if and (not .Values.secret.create) (not (or $hasSecretName $hasExtraEnvFrom)) -}}
{{- fail "When secret.create is false, you must provide secret.name or at least one extraEnvFrom source." -}}
{{- end -}}

{{- if and (not $imageTag) (not $imageDigest) -}}
{{- fail "Set exactly one of image.tag or image.digest." -}}
{{- end -}}

{{- if and $imageTag $imageDigest -}}
{{- fail "Set exactly one of image.tag or image.digest, not both. When using image.digest, set image.tag to an empty string." -}}
{{- end -}}

{{- if and $imageDigest (not (regexMatch "^sha256:[0-9a-f]{64}$" $imageDigest)) -}}
{{- fail "image.digest must match sha256:<64 lowercase hex characters>." -}}
{{- end -}}

{{- if and $imageDigest (eq .Values.image.pullPolicy "Always") -}}
{{- fail "image.pullPolicy must be IfNotPresent or Never when image.digest is set." -}}
{{- end -}}

{{- if and $releaseID (not (regexMatch $labelValuePattern $releaseID)) -}}
{{- fail "release.id must be a valid Kubernetes label value: 63 characters or less, using letters, numbers, '_', '.', or '-', and starting and ending with a letter or number." -}}
{{- end -}}

{{- if and $appVersion (not (regexMatch $labelValuePattern $appVersion)) -}}
{{- fail "release.appVersion, or Chart.AppVersion when release.appVersion is empty, must be a valid Kubernetes label value: 63 characters or less, using letters, numbers, '_', '.', or '-', and starting and ending with a letter or number." -}}
{{- end -}}

{{- /* The application Service selects app.kubernetes.io/component=server. A
       user-supplied pod label of the same key would otherwise deselect every
       server pod. The deployment template also writes the chart value after
       podLabels; this guard rejects the override up front. */ -}}
{{- $podLabels := .Values.podLabels | default dict -}}
{{- if hasKey $podLabels "app.kubernetes.io/component" -}}
{{- fail "podLabels must not set app.kubernetes.io/component. The chart pins that label to server so the application Service selects only server pods." -}}
{{- end -}}

{{- /* SingleInstance cannot coordinate more than one replica. The deployment and
       pdb templates both treat the workload as multi-replica when
       autoscaling.enabled OR replicaCount > 1, so guard the same predicate here.
       Previously only autoscaling.enabled was rejected, which let an operator set
       replicaCount > 1 in the default SingleInstance mode and silently render
       multiple uncoordinated pods behind one Service (plus auto podAntiAffinity
       and a PDB). */ -}}
{{- $deploymentMode := trim (default "SingleInstance" (dig "env" "Deployment__Mode" "SingleInstance" .Values.config)) -}}
{{- $multiReplica := or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1) -}}
{{- if and $multiReplica (eq $deploymentMode "SingleInstance") -}}
{{- fail (printf "Running more than one replica (autoscaling.enabled=%v, replicaCount=%v) is incompatible with config.env.Deployment__Mode=SingleInstance: a single-instance server does not coordinate multiple replicas. Either keep SingleInstance with autoscaling.enabled=false and replicaCount: 1, or switch to horizontally scaled HA by setting config.env.Deployment__Mode=MultiNode and supplying ConnectionStrings__redis plus a shared cloud FileStorage:Provider (AwsS3 or AzureBlob; Local is rejected in MultiNode)." .Values.autoscaling.enabled .Values.replicaCount) -}}
{{- end -}}

{{- /* The container port and all three health probes follow service.targetPort
       (the container's named "http" port). ASPNETCORE_URLS must listen on that
       same port or every probe targets a port nothing serves and the pod never
       becomes ready. */ -}}
{{- $configEnv := get (.Values.config | default dict) "env" | default dict -}}
{{- $aspnetUrls := trim (default "" (get $configEnv "ASPNETCORE_URLS")) -}}
{{- if $aspnetUrls -}}
{{- $targetPort := toString .Values.service.targetPort -}}
{{- $urlPortMatch := regexFind ":[0-9]+" $aspnetUrls -}}
{{- $urlPort := trimPrefix ":" $urlPortMatch -}}
{{- if and $urlPort (ne $urlPort $targetPort) -}}
{{- fail (printf "config.env.ASPNETCORE_URLS listens on port %s but service.targetPort is %s. The container port and the liveness/readiness/startup probes all follow service.targetPort, so these must match; align ASPNETCORE_URLS and service.targetPort." $urlPort $targetPort) -}}
{{- end -}}
{{- end -}}

{{- /* When the chart derives the PostgreSQL/Redis connection string from a
       subchart password, the password is interpolated into a delimiter-sensitive
       connection string. Reject the delimiter/keyword characters that would
       corrupt it; operators with such passwords must set the connection string
       explicitly via secret.env. */ -}}
{{- if eq (include "honua.usesChartManagedPostgresqlConnection" .) "true" -}}
{{- $pgPassword := toString (default "" .Values.postgresql.auth.password) -}}
{{- if regexMatch "[;=]" $pgPassword -}}
{{- fail "postgresql.auth.password must not contain ';' or '=' when the chart derives ConnectionStrings__DefaultConnection: those characters are parsed by Npgsql as additional connection keywords and corrupt the credential. Set secret.env.ConnectionStrings__DefaultConnection explicitly for such passwords." -}}
{{- end -}}
{{- end -}}
{{- if eq (include "honua.usesChartManagedRedisConnection" .) "true" -}}
{{- $redisPassword := toString (default "" .Values.redis.auth.password) -}}
{{- if regexMatch "[,=]" $redisPassword -}}
{{- fail "redis.auth.password must not contain ',' or '=' when the chart derives ConnectionStrings__redis: those characters split/terminate the StackExchange.Redis configuration string and corrupt the credential. Set secret.env.ConnectionStrings__redis explicitly for such passwords." -}}
{{- end -}}
{{- end -}}

{{- /* When the server is told to emit telemetry, require a receiver so the
       chart cannot ship "observability on, nothing listening". A receiver is an
       OTLP collector endpoint, a Prometheus ServiceMonitor, or Prometheus scrape
       annotations. */ -}}
{{- $otel := lower (trim (toString (default "" (get $configEnv "HONUA_OPENTELEMETRY")))) -}}
{{- $obs := lower (trim (toString (default "" (get $configEnv "HONUA_OBSERVABILITY")))) -}}
{{- if or (eq $otel "true") (eq $obs "true") -}}
{{- $observability := .Values.observability | default dict -}}
{{- $metrics := .Values.metrics | default dict -}}
{{- $serviceMonitor := get $metrics "serviceMonitor" | default dict -}}
{{- $serviceAnnotations := get $metrics "serviceAnnotations" | default dict -}}
{{- $hasOtlp := ne (trim (toString (default "" (get $observability "otlpEndpoint")))) "" -}}
{{- $hasServiceMonitor := eq (toString (default false (get $serviceMonitor "enabled"))) "true" -}}
{{- $hasScrapeAnnotations := eq (toString (default false (get $serviceAnnotations "enabled"))) "true" -}}
{{- if not (or $hasOtlp $hasServiceMonitor $hasScrapeAnnotations) -}}
{{- fail "config.env.HONUA_OPENTELEMETRY/HONUA_OBSERVABILITY is enabled but no telemetry receiver is configured. Set observability.otlpEndpoint to an OpenTelemetry collector, or enable metrics.serviceMonitor.enabled / metrics.serviceAnnotations.enabled. Otherwise disable observability so the deployment is not blind." -}}
{{- end -}}
{{- end -}}

{{- /* An AlertmanagerConfig with no receivers is a no-op that silently drops
       alerts. When the receiver surface is enabled, require at least one
       receiver so the chart cannot ship "routing on, nowhere to deliver". */ -}}
{{- $metricsValues := .Values.metrics | default dict -}}
{{- $amConfig := get $metricsValues "alertmanagerConfig" | default dict -}}
{{- if eq (toString (default false (get $amConfig "enabled"))) "true" -}}
{{- if not (get $amConfig "receivers") -}}
{{- fail "metrics.alertmanagerConfig.enabled is true but metrics.alertmanagerConfig.receivers is empty. Define at least one receiver (name + a *Configs list), or disable metrics.alertmanagerConfig so alerts are not routed into a no-op." -}}
{{- end -}}
{{- end -}}

{{- /* Autoscaling requires at least one positive target utilization. Moved here
       from hpa.yaml so the cross-field guard lives in the validation layer; the
       schema also requires this for autoscaling.enabled=true. */ -}}
{{- if .Values.autoscaling.enabled -}}
{{- $hasCPU := gt (int (default 0 .Values.autoscaling.targetCPUUtilizationPercentage)) 0 -}}
{{- $hasMemory := gt (int (default 0 .Values.autoscaling.targetMemoryUtilizationPercentage)) 0 -}}
{{- if not (or $hasCPU $hasMemory) -}}
{{- fail "autoscaling.enabled requires targetCPUUtilizationPercentage and/or targetMemoryUtilizationPercentage greater than 0" -}}
{{- end -}}
{{- end -}}

{{- /* A PodDisruptionBudget accepts exactly one of minAvailable/maxUnavailable.
       Moved here from pdb.yaml so the cross-field guard lives in the validation
       layer. */ -}}
{{- $pdb := .Values.podDisruptionBudget | default dict -}}
{{- if and (ne (dig "minAvailable" nil $pdb) nil) (ne (dig "maxUnavailable" nil $pdb) nil) -}}
{{- fail "Set only one of podDisruptionBudget.minAvailable or podDisruptionBudget.maxUnavailable, not both." -}}
{{- end -}}

{{- /* Deploy target registration must stay truthful: the chart only wires up
       the Honua GitOps hand-off backend (SupportsRollback=false, manual
       recovery via helm rollback). Rejecting any other backend value here
       prevents an operator from claiming a backend (e.g. an Argo Rollouts
       identifier) whose RBAC/CRDs/controller this chart does not install,
       which would advertise automatic rollback the installation cannot
       execute. Also guard that the identity fields this chart derives never
       resolve empty, since an empty TargetId/TargetName/Environment would
       register an unusable target. */ -}}
{{- if .Values.controlPlane.deployTarget.enabled -}}
{{- $deployTargetBackend := include "honua.deployTargetBackend" . -}}
{{- if ne $deployTargetBackend "honua-gitops-kubernetes" -}}
{{- fail (printf "controlPlane.deployTarget.backend must be \"honua-gitops-kubernetes\" (got %q). That is the only backend this chart's Deployment, RBAC, and CRDs support; other backends (for example an Argo Rollouts controller) are not wired up by this chart and would falsely advertise automatic rollback. Set controlPlane.deployTarget.enabled=false to skip target registration instead." $deployTargetBackend) -}}
{{- end -}}
{{- if not (trim (include "honua.deployTargetId" .)) -}}
{{- fail "controlPlane.deployTarget.targetId resolved to an empty value. Set controlPlane.deployTarget.targetId explicitly or ensure the chart fullname is non-empty." -}}
{{- end -}}
{{- if not (trim (include "honua.deployTargetName" .)) -}}
{{- fail "controlPlane.deployTarget.targetName resolved to an empty value. Set controlPlane.deployTarget.targetName explicitly or ensure the chart fullname is non-empty." -}}
{{- end -}}
{{- if not (trim (include "honua.deployTargetEnvironment" .)) -}}
{{- fail "controlPlane.deployTarget.environment resolved to an empty value. Set controlPlane.deployTarget.environment explicitly or set config.env.ASPNETCORE_ENVIRONMENT." -}}
{{- end -}}
{{- end -}}

{{- /* Chart-managed secret credential complexity/length policy. Enforced here in
       the validation layer (was previously welded to honua.secretData). Only the
       values the chart can see are checked; externally-managed secrets are
       validated at install time by the preflight Job. */ -}}
{{- if .Values.secret.create -}}
{{- include "honua.validateSecretComplexity" . -}}
{{- end -}}

{{- /* One source for the request secret reference allowlist: indexed entries from extraEnv would interleave with the chart-rendered list. */ -}}
{{- $requestSecretReferences := dig "requestSecretReferences" dict (.Values.security | default dict) }}
{{- if or $requestSecretReferences.allowedEnvironmentVariables $requestSecretReferences.allowedEnvironmentVariablePrefixes $requestSecretReferences.allowedSecretReferencePrefixes }}
{{- range .Values.extraEnv }}
{{- if hasPrefix "Security__RequestSecretReferences__" (.name | default "") }}
{{- fail (printf "%s must be configured through security.requestSecretReferences values, not duplicated in extraEnv" .name) }}
{{- end }}
{{- end }}
{{- range $key, $_ := ((.Values.config).env | default dict) }}
{{- if hasPrefix "Security__RequestSecretReferences__" $key }}
{{- fail (printf "%s must be configured through security.requestSecretReferences values, not duplicated in config.env" $key) }}
{{- end }}
{{- end }}
{{- range $key, $_ := ((.Values.secret).env | default dict) }}
{{- if hasPrefix "Security__RequestSecretReferences__" $key }}
{{- fail (printf "%s must be configured through security.requestSecretReferences values, not duplicated in secret.env" $key) }}
{{- end }}
{{- end }}
{{- end }}

{{- /* Dedicated licensing values must remain authoritative over explicit env. */ -}}
{{- range .Values.extraEnv }}
{{- if or (eq .name "Licensing__Mode") (and $.Values.licensing.edition (eq .name "Licensing__Edition")) (and $.Values.licensing.licenseSecretRef.name (eq .name "Licensing__LicenseContent")) }}
{{- fail (printf "%s must be configured through licensing values, not duplicated in extraEnv" .name) }}
{{- end }}
{{- end }}

{{- /* Geoprocessing on Kubernetes Jobs. The server builds each Job pod spec
       itself with literal env values only, so the worker's settings have to be
       complete and secret-free (cloud secret references) at render time. */ -}}
{{- if eq (include "honua.gpJobs.enabled" .) "true" -}}
{{- $gp := include "honua.gpJobs.values" . | fromJson -}}
{{- $allowInline := eq (toString (default false (get $gp "allowInlineWorkerSecrets"))) "true" -}}
{{- $workload := get $gp "workload" | default dict -}}
{{- $index := get $workload "index" -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $index))) (lt (atoi (toString $index)) 2) -}}
{{- fail "geoprocessing.kubernetesJobs.workload.index must be an integer >= 2: the server's appsettings.json already declares ControlPlane:ExecutionWorkloads:0 (local baseline) and :1 (AWS Batch placeholder), and an environment entry at those indexes would merge into them." -}}
{{- end -}}
{{- if not (trim (toString (default "" (get $workload "id")))) -}}
{{- fail "geoprocessing.kubernetesJobs.workload.id must not be empty." -}}
{{- end -}}
{{- $reserved := list "HONUA_OPERATION_ID" "HONUA_JOB_KIND" "HONUA_WORKLOAD_NAME" "HONUA_WORKLOAD_ID" "HONUA_RUNTIME_PROFILE" "HONUA_CONTRACT_VERSION" "HONUA_EXECUTION_ATTEMPT" -}}
{{- range $key, $_ := (get $gp "workerEnv" | default dict) -}}
{{- if has $key $reserved -}}
{{- fail (printf "geoprocessing.kubernetesJobs.workerEnv.%s is a launch variable the server stamps on every Job; it cannot be set." $key) -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_.-]*$" $key) -}}
{{- fail (printf "geoprocessing.kubernetesJobs.workerEnv key %q is not a valid environment variable name." $key) -}}
{{- end -}}
{{- end -}}
{{- $workerEnv := include "honua.gpJobs.workerEnv" . | fromJson -}}
{{- range $key, $value := $workerEnv -}}
{{- if and (not $allowInline) $value (eq (include "honua.gpJobs.isSensitiveName" $key) "true") (ne (include "honua.isSecretReference" $value) "true") -}}
{{- fail (printf "geoprocessing.kubernetesJobs worker setting %s must be an aws:secretsmanager: or azure:keyvault: reference. The server writes Job env as literal values into the Job spec and the durable job record, so a plain credential would be exposed there. Set geoprocessing.kubernetesJobs.workerEnv.%s to a reference the job service account can resolve (or set allowInlineWorkerSecrets=true on a disposable cluster)." $key $key) -}}
{{- end -}}
{{- end -}}
{{- $envFromMode := eq (include "honua.gpJobs.envFromMode" .) "true" -}}
{{- $configEnv := get (.Values.config | default dict) "env" | default dict -}}
{{- $secretEnv := get (.Values.secret | default dict) "env" | default dict -}}
{{- $pathKey := "Operations__SecretChannel__KeyRingCertificatePath" -}}
{{- $importedPath := and $envFromMode (or (get $configEnv $pathKey) (and .Values.secret.create (get $secretEnv $pathKey))) (not (and (hasKey $workerEnv $pathKey) (eq (toString (get $workerEnv $pathKey)) ""))) -}}
{{- if or $importedPath (and (hasKey $workerEnv $pathKey) (ne (toString (get $workerEnv $pathKey)) "")) -}}
{{- fail "geoprocessing.kubernetesJobs: the worker environment carries Operations__SecretChannel__KeyRingCertificatePath, but GP Job pods cannot mount files (the server's Job spec has no volumes). Set geoprocessing.kubernetesJobs.workerEnv.Operations__SecretChannel__KeyRingCertificatePkcs12 to an aws:secretsmanager:/azure:keyvault: reference and drop the path with workerEnv.Operations__SecretChannel__KeyRingCertificatePath: \"\"." -}}
{{- end -}}
{{- /* Only refuse when the chart can see the server's credentials. With an
       existing Secret (secret.create=false) the gap is reported in NOTES. */ -}}
{{- range $required := list "ConnectionStrings__DefaultConnection" "ConnectionStrings__redis" "Security__ConnectionEncryption__MasterKey" -}}
{{- if and (not $envFromMode) $.Values.secret.create (not (hasKey $workerEnv $required)) -}}
{{- fail (printf "geoprocessing.kubernetesJobs: GP Job workers need %s (the same database, Redis job store and master key as the server), and the chart cannot project it from a Kubernetes Secret because the server's Job spec carries literal env only. Put an aws:secretsmanager:/azure:keyvault: reference in secret.env.%s (inherited when inheritServerEnvironment is true) or in geoprocessing.kubernetesJobs.workerEnv.%s." $required $required $required) -}}
{{- end -}}
{{- end -}}
{{- $sa := get $gp "serviceAccount" | default dict -}}
{{- if and (not (eq (toString (ternary true (get $sa "create") (not (hasKey $sa "create")))) "true")) (not (trim (toString (default "" (get $sa "name"))))) -}}
{{- fail "geoprocessing.kubernetesJobs.serviceAccount.name is required when geoprocessing.kubernetesJobs.serviceAccount.create is false." -}}
{{- end -}}
{{- end -}}

{{- /* A native runtime profile needs the separate heavy-worker image. The
       server image this chart deploys runs managed jobs only, and
       honua.gpJobs.image falls back to it when no worker image is given, so a
       native workload with the default image fields installs cleanly and then
       fails at execution time. Require an explicit worker image first. */ -}}
{{- if eq (include "honua.gpJobs.enabled" .) "true" -}}
{{- $gpJobs := include "honua.gpJobs.values" . | fromJson -}}
{{- $gpWorkload := get $gpJobs "workload" | default dict -}}
{{- if eq (toString (default "managed" (get $gpWorkload "runtimeProfile"))) "native" -}}
{{- $gpImage := get $gpJobs "image" | default dict -}}
{{- $gpRepository := trim (default "" (get $gpImage "repository")) -}}
{{- $gpTag := trim (default "" (get $gpImage "tag")) -}}
{{- $gpDigest := trim (default "" (get $gpImage "digest")) -}}
{{- $gpFromConfig := include "honua.gpJobs.configEnv" (dict "context" . "name" "DefaultImage") -}}
{{- if and (not $gpRepository) (not $gpTag) (not $gpDigest) (not $gpFromConfig) -}}
{{- fail "geoprocessing.kubernetesJobs.workload.runtimeProfile is native, but no worker image is set, so the Jobs would run the chart's server image, which only supports the managed profile. Set geoprocessing.kubernetesJobs.image.repository plus .tag or .digest (or config.env.ControlPlane__Kubernetes__DefaultImage) to the native heavy-worker image." -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* Database:MigrationSafety has one source of truth. When a
       migrationSafety.* value renders a Database__MigrationSafety__* env var,
       the same key in config.env, secret.env or extraEnv is rejected rather
       than silently shadowed (explicit env would win over envFrom, and a
       duplicate extraEnv entry would make the winner order-dependent). */ -}}
{{- $migrationSafetyEnv := include "honua.migrationSafetyEnv" . | fromJson -}}
{{- range $name, $_ := $migrationSafetyEnv -}}
{{- if hasKey ((($.Values.config).env) | default dict) $name -}}
{{- fail (printf "%s is set by migrationSafety values; remove it from config.env." $name) -}}
{{- end -}}
{{- if hasKey ((($.Values.secret).env) | default dict) $name -}}
{{- fail (printf "%s is set by migrationSafety values; remove it from secret.env." $name) -}}
{{- end -}}
{{- range ($.Values.extraEnv | default list) -}}
{{- if eq (.name | default "") $name -}}
{{- fail (printf "%s is set by migrationSafety values; remove it from extraEnv." $name) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* Deploy telemetry connections and target parameters. The server validates
       these again at startup and plan time; these guards catch the mistakes the
       chart can see before an install fails or a gate is silently invalid. */ -}}
{{- $telemetryConnections := include "honua.telemetryConnections" . | fromJsonArray -}}
{{- $connectionIds := list -}}
{{- range $index, $connection := $telemetryConnections -}}
{{- $prefix := printf "controlPlane.telemetryConnections[%d]" (int $index) -}}
{{- $id := trim (toString (default "" (get $connection "connectionId"))) -}}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]*$" $id) -}}
{{- fail (printf "%s.connectionId must be a non-empty identifier (letters, numbers, '_', '.', '-'), got %q." $prefix $id) -}}
{{- end -}}
{{- if has $id $connectionIds -}}
{{- fail (printf "%s.connectionId %q is not unique; the server rejects duplicate telemetry connection ids." $prefix $id) -}}
{{- end -}}
{{- $connectionIds = append $connectionIds $id -}}
{{- $baseUrl := trim (toString (default "" (get $connection "baseUrl"))) -}}
{{- $allowPrivate := eq (toString (default false (get $connection "allowPrivateNetworks"))) "true" -}}
{{- if not (regexMatch "^https?://[^\\s/@]+" $baseUrl) -}}
{{- fail (printf "%s.baseUrl must be an absolute http(s) URL without credentials, got %q." $prefix $baseUrl) -}}
{{- end -}}
{{- if and (not $allowPrivate) (not (hasPrefix "https://" $baseUrl)) -}}
{{- fail (printf "%s.baseUrl %q is not https. The server's outbound SSRF guard rejects http, private and loopback telemetry endpoints unless the connection sets allowPrivateNetworks: true (only for a trusted in-cluster or private Prometheus such as http://prometheus.monitoring.svc:9090)." $prefix $baseUrl) -}}
{{- end -}}
{{- $hasAuthName := ne (trim (toString (default "" (get $connection "authHeaderName")))) "" -}}
{{- $hasAuthRef := gt (len (get $connection "authHeaderSecretRef" | default dict)) 0 -}}
{{- if ne $hasAuthName $hasAuthRef -}}
{{- fail (printf "%s: set authHeaderName and authHeaderSecretRef together (the header value is read from that existing Secret through secretKeyRef; it is never written into a ConfigMap)." $prefix) -}}
{{- end -}}
{{- end -}}
{{- if gt (len $telemetryConnections) 0 -}}
{{- range $key, $_ := ((.Values.config).env | default dict) -}}
{{- if hasPrefix "ControlPlane__TelemetryConnections__" $key -}}
{{- fail (printf "%s must be configured through controlPlane.telemetryConnections, not duplicated in config.env" $key) -}}
{{- end -}}
{{- end -}}
{{- range $key, $_ := ((.Values.secret).env | default dict) -}}
{{- if hasPrefix "ControlPlane__TelemetryConnections__" $key -}}
{{- fail (printf "%s must be configured through controlPlane.telemetryConnections (header values through authHeaderSecretRef), not duplicated in secret.env" $key) -}}
{{- end -}}
{{- end -}}
{{- range (.Values.extraEnv | default list) -}}
{{- if hasPrefix "ControlPlane__TelemetryConnections__" (.name | default "") -}}
{{- fail (printf "%s must be configured through controlPlane.telemetryConnections, not duplicated in extraEnv" .name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $targetTelemetry := (get (.Values.controlPlane.deployTarget | default dict) "telemetry") | default dict -}}
{{- $targetConnection := trim (toString (default "" (get $targetTelemetry "connection"))) -}}
{{- $targetParameters := get $targetTelemetry "parameters" | default dict -}}
{{- if or $targetConnection (gt (len $targetParameters) 0) -}}
{{- if not .Values.controlPlane.deployTarget.enabled -}}
{{- fail "controlPlane.deployTarget.telemetry is set but controlPlane.deployTarget.enabled is false, so no target would carry it. Enable target registration or clear controlPlane.deployTarget.telemetry." -}}
{{- end -}}
{{- if and $targetConnection (not (has $targetConnection $connectionIds)) -}}
{{- fail (printf "controlPlane.deployTarget.telemetry.connection %q does not name a connectionId in controlPlane.telemetryConnections; the server would reject the plan because the connection is not configured." $targetConnection) -}}
{{- end -}}
{{- range $key, $value := $targetParameters -}}
{{- if eq $key "telemetry.connection" -}}
{{- fail "Set the target's telemetry connection with controlPlane.deployTarget.telemetry.connection, not controlPlane.deployTarget.telemetry.parameters." -}}
{{- end -}}
{{- if not (regexMatch "^telemetry\\.[A-Za-z0-9_.]+$" $key) -}}
{{- fail (printf "controlPlane.deployTarget.telemetry.parameters key %q must start with \"telemetry.\"." $key) -}}
{{- end -}}
{{- if eq (trim (toString $value)) "" -}}
{{- fail (printf "controlPlane.deployTarget.telemetry.parameters.%s must not be empty." $key) -}}
{{- end -}}
{{- end -}}
{{- range $key, $_ := ((.Values.config).env | default dict) -}}
{{- if or (hasPrefix "ControlPlane__DeployTargets__0__ParameterEntries__" $key) (hasPrefix "ControlPlane__DeployTargets__0__Parameters__" $key) -}}
{{- fail (printf "%s must be configured through controlPlane.deployTarget.telemetry, not duplicated in config.env" $key) -}}
{{- end -}}
{{- end -}}
{{- /* The runtime Secret loads after the deploy-target ConfigMap, so a
       secret.env entry would override or interleave the generated entries. */ -}}
{{- range $key, $_ := ((.Values.secret).env | default dict) -}}
{{- if or (hasPrefix "ControlPlane__DeployTargets__0__ParameterEntries__" $key) (hasPrefix "ControlPlane__DeployTargets__0__Parameters__" $key) -}}
{{- fail (printf "%s must be configured through controlPlane.deployTarget.telemetry, not duplicated in secret.env" $key) -}}
{{- end -}}
{{- end -}}
{{- range (.Values.extraEnv | default list) -}}
{{- if or (hasPrefix "ControlPlane__DeployTargets__0__ParameterEntries__" (.name | default "")) (hasPrefix "ControlPlane__DeployTargets__0__Parameters__" (.name | default "")) -}}
{{- fail (printf "%s must be configured through controlPlane.deployTarget.telemetry, not duplicated in extraEnv" .name) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /* Out-of-band migrations. HONUA_MIGRATE_ONLY turns any process into a
       one-shot migrator that never serves, so it is never user env: only the
       migration Job sets it. While the Job is enabled, HONUA_SKIP_MIGRATIONS
       on the serving pods is chart-owned too; a user value would either be
       shadowed or, from extraEnv, win by list order and re-enable inline
       migrations under RollingUpdate. */ -}}
{{- range $source, $env := dict "config.env" ((.Values.config).env | default dict) "secret.env" ((.Values.secret).env | default dict) -}}
{{- if hasKey $env "HONUA_MIGRATE_ONLY" -}}
{{- fail (printf "HONUA_MIGRATE_ONLY must not be set in %s: it makes the server migrate and exit instead of serving. Use migrations.job.enabled to run migrations out of band." $source) -}}
{{- end -}}
{{- end -}}
{{- range (.Values.extraEnv | default list) -}}
{{- if eq (.name | default "") "HONUA_MIGRATE_ONLY" -}}
{{- fail "HONUA_MIGRATE_ONLY must not be set in extraEnv: it makes the server migrate and exit instead of serving. Use migrations.job.enabled to run migrations out of band." -}}
{{- end -}}
{{- end -}}
{{- if hasKey (dig "kubernetesJobs" "workerEnv" dict (.Values.geoprocessing | default dict)) "HONUA_MIGRATE_ONLY" -}}
{{- fail "HONUA_MIGRATE_ONLY must not be set in geoprocessing.kubernetesJobs.workerEnv." -}}
{{- end -}}
{{- if eq (include "honua.migrationsJob.enabled" .) "true" -}}
{{- $skipSources := include "honua.userEnvSources" (dict "name" "HONUA_SKIP_MIGRATIONS" "context" .) | fromJsonArray -}}
{{- if $skipSources -}}
{{- fail (printf "migrations.job.enabled sets HONUA_SKIP_MIGRATIONS=true on the serving pods; remove HONUA_SKIP_MIGRATIONS from %s." (join ", " $skipSources)) -}}
{{- end -}}
{{- if .Values.postgresql.enabled -}}
{{- fail "migrations.job.enabled cannot be used with the chart-managed postgresql subchart: the migration Job runs as a pre-install hook, before the subchart's database exists. Point secret.env.ConnectionStrings__DefaultConnection at an external PostGIS database, or keep inline migrations (migrations.job.enabled=false) for the dev subchart." -}}
{{- end -}}
{{- $job := .Values.migrations.job -}}
{{- if lt (int (default 0 $job.activeDeadlineSeconds)) 1 -}}
{{- fail "migrations.job.activeDeadlineSeconds must be a positive number of seconds." -}}
{{- end -}}
{{- end -}}

{{- /* The schema rejects a zero RollingUpdate budget only when strategy.type is
       set explicitly; the chart-chosen RollingUpdate (empty type with the
       migration Job enabled) is checked here. */ -}}
{{- if eq (include "honua.strategyType" .) "RollingUpdate" -}}
{{- $rolling := dig "rollingUpdate" dict (.Values.strategy | default dict) -}}
{{- $zero := list "0" "0%" -}}
{{- $surge := regexReplaceAll "^0+([0-9])" (toString (get $rolling "maxSurge")) "${1}" -}}
{{- $unavailable := regexReplaceAll "^0+([0-9])" (toString (get $rolling "maxUnavailable")) "${1}" -}}
{{- if and (has $surge $zero) (has $unavailable $zero) -}}
{{- fail "strategy.rollingUpdate needs a non-zero maxSurge or maxUnavailable: with both zero a RollingUpdate can never replace a pod." -}}
{{- end -}}
{{- end -}}
