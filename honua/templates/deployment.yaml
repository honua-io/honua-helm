apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honua.fullname" . }}
  labels:
    {{- include "honua.labels" . | nindent 4 }}
    {{- include "honua.releaseLabels" . | nindent 4 }}
  annotations:
    {{- include "honua.releaseAnnotations" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ default "Recreate" .Values.strategy.type }}
    {{- if eq (default "Recreate" .Values.strategy.type) "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "honua.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "honua.selectorLabels" . | nindent 8 }}
        {{- include "honua.releaseLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "honua.releaseAnnotations" . | nindent 8 }}
        {{- /* Roll the pods whenever the chart-managed ConfigMap/Secret content
               changes. These are consumed via envFrom, which Kubernetes reads
               only at container start, so without a content checksum a
               helm upgrade that only edits config.env or secret.env produces a
               byte-identical Deployment, performs no rollout, and leaves pods
               running stale config or un-rotated credentials. */ -}}
        {{- if .Values.config.create }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.secret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.controlPlane.deployTarget.enabled }}
        checksum/deploy-target: {{ include (print $.Template.BasePath "/deploy-target-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "honua.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: honua
          image: {{ include "honua.imageReference" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "honua.releaseInfoConfigMapName" . }}
            {{- if .Values.controlPlane.deployTarget.enabled }}
            - configMapRef:
                name: {{ include "honua.deployTargetConfigMapName" . }}
            {{- end }}
            {{- if or .Values.config.create .Values.config.name }}
            - configMapRef:
                name: {{ include "honua.configmapName" . }}
            {{- end }}
            {{- if or .Values.secret.create .Values.secret.name }}
            - secretRef:
                name: {{ include "honua.secretName" . }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $otlpEndpoint := trim (default "" (dig "otlpEndpoint" "" (.Values.observability | default dict))) }}
          {{- if or $otlpEndpoint .Values.extraEnv }}
          env:
            {{- if $otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ default "grpc" (dig "otlpProtocol" "grpc" (.Values.observability | default dict)) | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.tmpVolume.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.tmpVolume.enabled .Values.extraVolumes }}
      volumes:
        {{- if .Values.tmpVolume.enabled }}
        - name: tmp
          {{- if .Values.tmpVolume.sizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $multiReplica := or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 1) }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if $multiReplica }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "honua.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
