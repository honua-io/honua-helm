# Exercises the observability/metrics integration: OTLP endpoint wiring plus the
# ServiceMonitor, Prometheus scrape annotations, the PrometheusRule (baseline
# availability + application SLO rules, including the GeoServices in-band
# 200-with-{error} signal), and the AlertmanagerConfig receiver surface.
config:
  env:
    HONUA_OBSERVABILITY: "true"
    HONUA_OPENTELEMETRY: "true"

observability:
  otlpEndpoint: "http://otel-collector.observability.svc:4317"
  otlpProtocol: "grpc"

metrics:
  serviceMonitor:
    enabled: true
    interval: 15s
    labels:
      release: kube-prometheus-stack
  serviceAnnotations:
    enabled: true
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
    slo:
      enabled: true
      metricSelector: 'service="honua-server"'
      alertLabels:
        service: honua-server
  alertmanagerConfig:
    enabled: true
    labels:
      alertmanagerConfig: honua
    route:
      receiver: honua-slack
      groupBy: ["alertname", "route"]
      routes:
        - matchers:
            - name: route
              value: pagerduty-critical
          receiver: honua-pagerduty
    receivers:
      - name: honua-slack
        slackConfigs:
          - apiURL:
              name: honua-alertmanager-secrets
              key: slackApiUrl
            channel: "#honua-alerts"
            sendResolved: true
      - name: honua-pagerduty
        pagerdutyConfigs:
          - routingKey:
              name: honua-alertmanager-secrets
              key: pagerdutyRoutingKey
            sendResolved: true

secret:
  env:
    ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=honua;Username=honua;Password=ci-password"
    HONUA_ADMIN_PASSWORD: "CiAdminPassword1!"
    Security__ConnectionEncryption__MasterKey: "ci-connection-encryption-master-key-00000001"
    ConnectionStrings__redis: "redis:6379,password=ci-redis-password"
