# Allowlist for request-supplied secret references: one entry per list so CI can
# assert the indexed Security__RequestSecretReferences__* environment variables.
security:
  requestSecretReferences:
    allowedEnvironmentVariables:
      - HONUA_IMPORT_ARCGIS_TOKEN
    allowedEnvironmentVariablePrefixes:
      - HONUA_IMPORT_
    allowedSecretReferencePrefixes:
      - "aws:secretsmanager:honua/imports/"
      - "azure:keyvault:honua-imports:"
