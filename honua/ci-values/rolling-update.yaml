replicaCount: 2
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
release:
  id: honua-ci-rolling
  manifest: "ci://honua-helm/rolling-update"
secret:
  env:
    ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=honua;Username=honua;Password=ci-password"
    HONUA_ADMIN_PASSWORD: "ci-admin-password"
