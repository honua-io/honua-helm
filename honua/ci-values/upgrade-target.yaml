# The in-cluster smoke runs the real honua-server in kind, which has no shared
# cloud FileStorage, so it must stay SingleInstance (MultiNode rejects Local
# storage). SingleInstance with more than one replica is rejected by the chart's
# HA guard, so this upgrade target stays at one replica; it still exercises the
# strategy switch to RollingUpdate, the release-metadata change, and the
# config/secret checksum-driven rollout.
replicaCount: 1
image:
  pullPolicy: IfNotPresent
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
release:
  id: honua-ci-upgrade-target
  manifest: "ci://honua-helm/upgrade-target"
secret:
  env:
    ConnectionStrings__DefaultConnection: "Host=honua-postgis;Port=5432;Database=honua;Username=honua;Password=ci-password"
    HONUA_ADMIN_PASSWORD: "CiAdminPassword1!"
    Security__ConnectionEncryption__MasterKey: "ci-connection-encryption-master-key-00000001"
    ConnectionStrings__redis: "honua-redis:6379,password=ci-redis-password"

# Exercise authenticated API calls through the Service with host validation on.
config:
  env:
    Public__BaseUrl: "http://honua-honua"
